<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ICEMD-2026 Admin Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      color: #17365d;
      margin-top: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input[readonly] {
      background: #f7f7f7;
      color: #222;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .button {
      background: #17365d;
      color: white;
    }

    .button:hover {
      opacity: 0.92;
    }

    .secondary {
      background: #666;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #b8dfc1;
    }

    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f1bfc4;
    }

    .welcome {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: #17365d;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- =================================================
       ADMIN LOGIN PAGE
  ================================================== -->

  <div
    id="adminLoginPage"
    class="card"
  >

    <h1>
      ICEMD-2026
    </h1>

    <h2>
      Admin Login
    </h2>

    <p class="subtitle">
      Registration Desk
    </p>


    <label for="adminEmail">
      Email
    </label>

    <input
      type="text"
      id="adminEmail"
      value="pal.17@iitj.ac.in"
      readonly
    >


    <label for="adminPassword">
      Password
    </label>

    <input
      type="password"
      id="adminPassword"
      value="icemd@20260317"
      readonly
    >


    <button
      id="loginButton"
      class="button"
      type="button"
      onclick="adminLogin()"
    >
      Login
    </button>


    <button
      class="button secondary"
      type="button"
      onclick="goBack()"
    >
      Back
    </button>


    <div
      id="adminMessage"
      class="message"
    ></div>


    <p
      style="
        text-align:center;
        color:#666;
        margin-top:20px;
        margin-bottom:0;
      "
    >
    
    </p>

  </div>


  <!-- =================================================
       SIMPLE ADMIN DASHBOARD
  ================================================== -->

  <div
    id="adminHomePage"
    class="card hidden"
  >

    <h1>
      ICEMD-2026
    </h1>

    <h2>
      Admin Dashboard
    </h2>

    <p class="welcome">
      Welcome, Biswajit Pal
    </p>


    <button
      class="button"
      type="button"
      onclick="alert('Admin Console will be added here.')"
    >
      Admin Console
    </button>


    <button
      class="button secondary"
      type="button"
      onclick="adminLogout()"
    >
      Logout
    </button>


    <p
      style="
        text-align:center;
        color:#666;
        margin-top:20px;
        margin-bottom:0;
      "
    >
      ICEMD-2026 IIT Jodhpur Registration Desk
    </p>

  </div>

</div>


<script>

/* =====================================================
   FIXED CREDENTIALS
===================================================== */

const FIXED_EMAIL = "pal.17@iitj.ac.in";
const FIXED_PASSWORD = "icemd@20260317";


/* =====================================================
   ADMIN LOGIN
===================================================== */

function adminLogin() {

  const email =
    document.getElementById("adminEmail").value;

  const password =
    document.getElementById("adminPassword").value;


  if (
    email === FIXED_EMAIL &&
    password === FIXED_PASSWORD
  ) {

    document
      .getElementById("adminLoginPage")
      .classList.add("hidden");

    document
      .getElementById("adminHomePage")
      .classList.remove("hidden");

    return;
  }


  const message =
    document.getElementById("adminMessage");

  message.textContent =
    "Invalid Admin email or password.";

  message.className =
    "message error";
}


/* =====================================================
   LOGOUT
===================================================== */

function adminLogout() {

  document
    .getElementById("adminHomePage")
    .classList.add("hidden");

  document
    .getElementById("adminLoginPage")
    .classList.remove("hidden");

}


/* =====================================================
   BACK
===================================================== */

function goBack() {

  window.history.back();

}

</script>

</body>
</html>
