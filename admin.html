<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ICEMD-2026 Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      color: #17365d;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #17365d;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .button {
      background: #17365d;
      color: white;
    }

    .secondary {
      background: #666;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #b8dfc1;
    }

    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f1bfc4;
    }

    .footer {
      text-align: center;
      color: #666;
      margin-top: 20px;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ADMIN LOGIN -->
    <div id="loginPage" class="card">

      <h1>ICEMD-2026</h1>

      <h2>Admin Login</h2>

      <p class="subtitle">
        Registration Desk
      </p>

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter email address"
        autocomplete="username"
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button
        class="button"
        onclick="login()"
      >
        Login
      </button>

      <button
        class="secondary"
        onclick="goBack()"
      >
        Back
      </button>

      <div id="message" class="message"></div>

      <div class="footer">
        ICEMD-2026 IIT Jodhpur Registration Desk
      </div>

    </div>


    <!-- SIMPLE SUCCESS PAGE -->
    <div id="successPage" class="card hidden">

      <h1>ICEMD-2026</h1>

      <h2>Admin Dashboard</h2>

      <p class="subtitle">
        Welcome, Biswajit Pal
      </p>

      <button
        class="secondary"
        onclick="logout()"
      >
        Logout
      </button>

      <div class="footer">
        ICEMD-2026 IIT Jodhpur Registration Desk
      </div>

    </div>

  </div>


  <script>

    /*
     * =====================================================
     * FIXED ADMIN LOGIN
     *
     * This version is intentionally standalone.
     * No Apps Script.
     * No Google Sheet.
     * No API.
     * No JSONP.
     * =====================================================
     */

    const ADMIN_EMAIL = "pal.17@iitj.ac.in";
    const ADMIN_PASSWORD = "icemd@20260317";


    /*
     * =====================================================
     * SHOW MESSAGE
     * =====================================================
     */

    function showMessage(message, type) {

      const box =
        document.getElementById("message");

      box.innerText = message;

      box.className =
        "message " +
        (type === "success" ? "success" : "error");
    }


    /*
     * =====================================================
     * CLEAR MESSAGE
     * =====================================================
     */

    function clearMessage() {

      const box =
        document.getElementById("message");

      box.innerText = "";
      box.className = "message";
    }


    /*
     * =====================================================
     * ADMIN LOGIN
     * =====================================================
     */

    function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("password")
          .value;

      clearMessage();


      /*
       * Check empty fields.
       */

      if (!email || !password) {

        showMessage(
          "Please enter email and password.",
          "error"
        );

        return;
      }


      /*
       * Check fixed credentials.
       */

      if (
        email === ADMIN_EMAIL.toLowerCase() &&
        password === ADMIN_PASSWORD
      ) {

        document
          .getElementById("loginPage")
          .classList.add("hidden");

        document
          .getElementById("successPage")
          .classList.remove("hidden");

        return;
      }


      /*
       * Invalid credentials.
       */

      showMessage(
        "Invalid email or password.",
        "error"
      );
    }


    /*
     * =====================================================
     * LOGOUT
     * =====================================================
     */

    function logout() {

      document
        .getElementById("password")
        .value = "";

      clearMessage();

      document
        .getElementById("successPage")
        .classList.add("hidden");

      document
        .getElementById("loginPage")
        .classList.remove("hidden");
    }


    /*
     * =====================================================
     * BACK
     *
     * Change this later to your desired page.
     * For now, simply go back in browser history.
     * =====================================================
     */

    function goBack() {

      if (window.history.length > 1) {
        window.history.back();
      }
    }


    /*
     * =====================================================
     * ENTER KEY LOGIN
     * =====================================================
     */

    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          login();
        }

      });

  </script>

</body>
</html>
