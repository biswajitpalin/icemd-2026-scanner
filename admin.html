<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ICEMD-2026 Admin Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      color: #17365d;
      margin-top: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #17365d;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    .button {
      background: #17365d;
      color: white;
    }

    .button:hover {
      opacity: 0.92;
    }

    .secondary {
      background: #666;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #b8dfc1;
    }

    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f1bfc4;
    }

    .welcome {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: #17365d;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- =================================================
       ADMIN LOGIN PAGE
  ================================================== -->

  <div
    id="adminLoginPage"
    class="card"
  >

    <h1>
      ICEMD-2026
    </h1>

    <h2>
      Admin Login
    </h2>

    <p class="subtitle">
      Registration Desk
    </p>


    <label for="adminEmail">
      Email
    </label>

    <input
      type="email"
      id="adminEmail"
      placeholder="Enter email address"
      autocomplete="email"
    >


    <label for="adminPassword">
      Password
    </label>

    <input
      type="password"
      id="adminPassword"
      placeholder="Enter password"
      autocomplete="current-password"
    >


    <button
      id="loginButton"
      class="button"
      onclick="adminLogin()"
    >
      Login
    </button>


    <button
      class="button secondary"
      onclick="goBack()"
    >
      Back
    </button>


    <div
      id="adminMessage"
      class="message"
    ></div>


    <p
      style="
        text-align:center;
        color:#666;
        margin-top:20px;
        margin-bottom:0;
      "
    >
      ICEMD-2026 IIT Jodhpur Registration Desk
    </p>

  </div>


  <!-- =================================================
       ADMIN HOME PAGE
  ================================================== -->

  <div
    id="adminHomePage"
    class="card hidden"
  >

    <h1>
      ICEMD-2026
    </h1>

    <h2>
      Admin Dashboard
    </h2>

    <p class="welcome">
      Welcome, Biswajit Pal
    </p>


    <button
      class="button"
      onclick="alert('Admin console will be added here.')"
    >
      Admin Console
    </button>


    <button
      class="button secondary"
      onclick="adminLogout()"
    >
      Logout
    </button>


    <p
      style="
        text-align:center;
        color:#666;
        margin-top:20px;
        margin-bottom:0;
      "
    >
      ICEMD-2026 IIT Jodhpur Registration Desk
    </p>

  </div>

</div>


<script>

/* =====================================================
   FIXED ADMIN CREDENTIALS

   GitHub-only test version.
   No Apps Script.
   No Google Sheet.
   No API.
===================================================== */

const ADMIN_EMAIL = "pal.17@iitj.ac.in";
const ADMIN_PASSWORD = "icemd@20260317";


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(message, type) {

  const box =
    document.getElementById("adminMessage");

  box.textContent = message;

  box.className =
    "message " +
    (type === "success" ? "success" : "error");
}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage() {

  const box =
    document.getElementById("adminMessage");

  box.textContent = "";
  box.className = "message";
}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function adminLogin() {

  const emailInput =
    document.getElementById("adminEmail");

  const passwordInput =
    document.getElementById("adminPassword");

  const email =
    String(emailInput.value || "")
      .trim()
      .toLowerCase();

  const password =
    String(passwordInput.value || "");

  clearMessage();


  if (!email || !password) {

    showMessage(
      "Please enter email and password.",
      "error"
    );

    return;
  }


  if (
    email === ADMIN_EMAIL &&
    password === ADMIN_PASSWORD
  ) {

    document
      .getElementById("adminLoginPage")
      .classList.add("hidden");

    document
      .getElementById("adminHomePage")
      .classList.remove("hidden");

    return;
  }


  showMessage(
    "Invalid Admin email or password.",
    "error"
  );
}


/* =====================================================
   LOGOUT
===================================================== */

function adminLogout() {

  document
    .getElementById("adminEmail")
    .value = "";

  document
    .getElementById("adminPassword")
    .value = "";

  clearMessage();

  document
    .getElementById("adminHomePage")
    .classList.add("hidden");

  document
    .getElementById("adminLoginPage")
    .classList.remove("hidden");
}


/* =====================================================
   BACK
===================================================== */

function goBack() {

  window.history.back();

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("adminPassword")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        adminLogin();
      }

    }
  );

</script>

</body>
</html>
