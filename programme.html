<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICEMD-2026 Programme Manager</title>
<style>
:root{--navy:#17365d;--green:#198754;--bg:#f3f5f9;--line:#dce3ed;--text:#172033;--muted:#64748b;--space:clamp(12px,1.25vw,22px)}
*{box-sizing:border-box}
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;width:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);font-size:15px;line-height:1.45}
header{width:100%;background:var(--navy);color:#fff;padding:clamp(16px,2vw,28px) clamp(16px,2.2vw,36px)}
header h1{font-size:clamp(21px,1.8vw,30px);line-height:1.2;margin:0 0 6px;font-weight:700;text-align:center}
header p{margin:0;color:#dce7f5;font-size:clamp(13px,1vw,16px)}
.wrap{width:100%;max-width:none;margin:0 auto;padding:var(--space) clamp(12px,1.5vw,26px) 20px}
.notice{padding:12px 14px;border-radius:8px;margin-bottom:14px;background:#e9f1fb;color:#17365d;font-size:14px;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space)}
.tab,button{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;font-size:14px;min-height:40px;touch-action:manipulation}
.tab{background:#e1e7f0;color:var(--navy)}.tab.active{background:var(--navy);color:#fff}
button.primary{background:var(--navy);color:#fff}button.save{background:var(--green);color:#fff}button.secondary{background:#e7ebf1;color:#24334b}button.danger{background:#b42318;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(300px, min(31vw,440px)) minmax(0,1fr);gap:var(--space);align-items:start;width:100%}
.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(13px,1.25vw,22px);box-shadow:0 2px 8px #17203308}
.panel h2{font-size:clamp(17px,1.15vw,21px);line-height:1.3;margin:0 0 16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}
label{font-size:14px;font-weight:700;color:#42516a}
input,select,textarea{width:100%;max-width:100%;border:1px solid #cbd4e1;border-radius:8px;padding:10px 11px;font:inherit;background:#fff;color:var(--text);min-width:0;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8dc;outline-offset:1px;border-color:#789ac7}
textarea{min-height:82px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tablewrap{width:100%;max-width:100%;overflow:auto;overscroll-behavior-x:contain;border-radius:6px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px;table-layout:auto}
th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf3;vertical-align:top;overflow-wrap:anywhere}
th{background:#f1f4f8;color:#34435b;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
.small{font-size:12px;color:#65738a}.record-title{font-weight:700;margin-bottom:4px}.rowactions{display:flex;gap:6px;flex-wrap:wrap;min-width:76px}.rowactions button{padding:7px 9px;min-height:32px;font-size:12px}
.status{margin:12px 0;padding:10px 12px;border-radius:7px;display:none;white-space:pre-wrap;overflow-wrap:anywhere}.status.ok{display:block;background:#e8f6ed;color:#17683a}.status.err{display:block;background:#fdeceb;color:#9f2018}.hidden{display:none!important}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.toolbar h2{margin:0}.toolbar input{width:min(100%,340px);margin-left:auto}
.empty{padding:25px;text-align:center;color:#65738a}.foot{font-size:12px;color:#65738a;margin:16px 0 4px}
@media(min-width:1500px){.layout{grid-template-columns:minmax(340px, min(28vw,500px)) minmax(0,1fr)}.panel{padding:22px}table{font-size:14px}th,td{padding:12px}}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.layout>.panel:first-child{width:100%}.tablewrap{max-height:none}.panel{padding:16px}}
@media(max-width:640px){body{font-size:14px}header{padding:17px 15px}header h1{font-size:21px}.wrap{padding:12px 10px 18px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tab{padding:10px 5px;font-size:12px;min-height:42px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}.panel{padding:13px;border-radius:10px}.panel h2{font-size:17px;margin-bottom:13px}.fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field.full{grid-column:1/-1}input,select,textarea{font-size:16px;padding:10px}.toolbar{align-items:stretch}.toolbar h2{width:100%}.toolbar input{width:100%;max-width:none;margin:0}.tablewrap{margin:0 -1px}table{min-width:760px;font-size:12px}th,td{padding:8px}.actions button{flex:1 1 auto}.status{font-size:13px}}
@media(max-width:380px){.fields{grid-template-columns:minmax(0,1fr)}.field.full{grid-column:auto}.tabs{grid-template-columns:1fr}.tab{text-align:center}.actions button{width:100%}}
@media(orientation:landscape) and (max-height:520px) and (max-width:1000px){header{padding:10px 16px}.wrap{padding-top:10px}.layout{grid-template-columns:minmax(280px,38%) minmax(0,1fr)}.panel{padding:12px}}

/* OTP login screen; programme manager remains hidden until OTP verification */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(22px,4vw,34px);box-shadow:0 5px 20px #14273f1a}
.login-card h1{text-align:center;color:var(--navy);font-size:clamp(24px,3vw,30px);margin:0 0 8px}
.login-card h2{text-align:center;color:var(--navy);font-size:clamp(18px,2.3vw,23px);margin:0 0 8px}
.login-subtitle{text-align:center;color:var(--muted);margin:0 0 24px}
.login-card label{display:block;font-size:14px;margin:16px 0 7px}
.login-card input{min-height:48px;font-size:16px}
.login-card .login-btn{width:100%;margin-top:15px;min-height:48px;font-size:16px}
.login-message{display:none;margin-top:16px;padding:12px;border-radius:8px;line-height:1.45;overflow-wrap:anywhere}
.login-message.ok{display:block;background:#e8f6ed;color:#17683a}
.login-message.err{display:block;background:#fdeceb;color:#9f2018}
#otpEmail{background:#e8f0fe;cursor:default}
@media(max-width:540px){.login-shell{padding:14px}.login-card{padding:22px 18px}}

.manager-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px 24px;
}

.manager-header h1 {
  font-size: clamp(20px, 2vw, 28px);
  line-height: 1.2;
  margin: 0;
  font-weight: 700;
  text-align: left;
}

.manager-account {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#loggedInEmail {
  color: #fff;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.manager-account button {
  background: #e7ebf1;
  color: #24334b;
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 700;
  cursor: pointer;
  min-height: 38px;
  font-size: 14px;
}

@media (max-width: 600px) {
  .manager-header {
    padding: 15px;
  }

  .manager-header h1 {
    font-size: 20px;
  }

  .manager-account {
    width: 100%;
    justify-content: flex-start;
  }
}

#assistantBackButton {
  background: #666666 !important;
  color: #ffffff !important;
}

</style></head><body>
<section id="managerLogin" class="login-shell">
  <div class="login-card">
    <h1>ICEMD-2026</h1>
    <h2>Programme Manager</h2>
    
    <div id="loginDetails">
      <label for="loginEmail">Programme Manager Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="Enter authorized email" required>
      <button id="sendOtpButton" class="primary login-btn" type="button">Send OTP</button>
      <button
        id="assistantBackButton"
        class="secondary login-btn"
        type="button"
        onclick="window.location.href = './index.html';"
        style="background:#666666;color:#ffffff;"
      >
        Back
      </button>
    </div>
    <div id="loginOtpSection" class="hidden">
      <label for="otpEmail">Admin Email</label>
      <input id="otpEmail" type="email" readonly aria-readonly="true">
      <label for="otpInput">Six-digit OTP</label>
      <input id="otpInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP received by email">
      <button id="verifyOtpButton" class="save login-btn" type="button">Verify OTP &amp; Login</button>
      <button id="resendOtpButton" class="primary login-btn hidden" type="button">Resend OTP</button>
      <button id="backLoginButto" class="secondary login-btn" type="button" style="background:#666666;color:#ffffff;">Back</button>      
    </div>
    <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>
  </div>
</section>
<div id="managerApp" class="hidden">

<header class="manager-header">
  <h1>ICEMD-2026 · Programme Manager</h1>
  <div class="manager-account">
    <span id="loggedInEmail"></span>
    <button id="backHomeButton" type="button" class="secondary">Back to Home</button>
    <button id="logoutButton" type="button" class="secondary">Logout</button>
  </div>
</header>

<main class="wrap"><div id="globalStatus" class="status"></div>
<div class="tabs"><button class="tab active" data-kind="days">Conference Days</button><button class="tab" data-kind="sessions">Sessions</button><button class="tab" data-kind="talks">Talks / Speakers</button></div>
<section id="daysPanel" class="kindPanel"><div class="layout"><div class="panel"><h2 id="dayFormTitle">Add Conference Day</h2><form id="dayForm"><input type="hidden" name="originalId"><div class="fields"><div class="field full"><label>Day ID *</label><input name="id" id="dayId" type="text" placeholder="e.g. DAY-001" required pattern="[A-Za-z0-9_-]+" title="Use letters, numbers, hyphens or underscores."><button class="primary" type="button" style="margin-top:8px" onclick="fetchRecordDetails('days')">Fetch Details</button></div><div class="field"><label>Day Number *</label><input name="Day Number" type="number" placeholder="e.g. number in order" min="1" required></div><div class="field"><label>Date *</label><input name="Date" type="date" required></div><div class="field full"><label>Day Title</label><input name="Day Title" placeholder="e.g. Inauguration and Technical Sessions"></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Day</button><button class="secondary" type="button" onclick="resetForm('dayForm')">Clear</button><button class="secondary" type="button" onclick="loadAll()">Refresh Records</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Conference Days</h2><input id="daySearch" placeholder="Search days…"></div><div id="daysList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<section id="sessionsPanel" class="kindPanel hidden"><div class="layout"><div class="panel"><h2 id="sessionFormTitle">Add Session</h2><form id="sessionForm"><input type="hidden" name="originalId"><div class="fields"><div class="field full"><label>Session ID *</label><input name="id" id="sessionId" type="text" placeholder="e.g. SES-001" required pattern="[A-Za-z0-9_-]+" title="Use letters, numbers, hyphens or underscores."><button class="primary" type="button" style="margin-top:8px" onclick="fetchRecordDetails('sessions')">Fetch Details</button></div><div class="field full"><label>Conference Day *</label><select name="Day ID" id="sessionDay" required></select></div><div class="field"><label>Session Category</label><select name="Session Category"><option>Inauguration</option><option>Keynote</option><option>Invited Talk</option><option>Technical Session</option><option>Oral Session</option><option>Poster Session</option><option>Break</option><option>Lunch</option><option>Panel Discussion</option><option>Valedictory</option><option>Other</option></select></div><div class="field"><label>Session Order</label><input name="Session Order" type="number" placeholder="number in order" min="1"></div><div class="field full"><label>Session Title *</label><input name="Session Title" placeholder="in text fromat" required></div><div class="field"><label>Start Time</label><input name="Start Time" type="time"></div><div class="field"><label>End Time</label><input name="End Time" type="time"></div><div class="field"><label>Session Chair</label><input name="Session Chair" placeholder="Prof.'s name"></div><div class="field"><label>Chair Affiliation</label><input name="Chair Affiliation" placeholder="Prof.'s institute"></div><div class="field full"><label>Venue</label><input name="Venue" placeholder="hall number"></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field"><label>Show Publicly</label><select name="Show Publicly"><option>YES</option><option>NO</option></select></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Session</button><button class="secondary" type="button" onclick="resetForm('sessionForm')">Clear</button><button class="secondary" type="button" onclick="loadAll()">Refresh Records</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Sessions</h2><input id="sessionSearch" placeholder="Search sessions…"></div><div id="sessionsList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<section id="talksPanel" class="kindPanel hidden"><div class="layout"><div class="panel"><h2 id="talkFormTitle">Add Talk / Speaker</h2><form id="talkForm"><input type="hidden" name="originalId"><div class="fields"><div class="field full"><label>Talk ID *</label><input name="id" id="talkId" type="text" placeholder="e.g. TALK-001" required pattern="[A-Za-z0-9_-]+" title="Use letters, numbers, hyphens or underscores."><button class="primary" type="button" style="margin-top:8px" onclick="fetchRecordDetails('talks')">Fetch Details</button></div><div class="field full"><label>Session *</label><select name="Session ID" id="talkSession" required></select></div><div class="field"><label>Talk Order</label><input name="Talk Order" type="number" placeholder="number in order" min="1"></div><div class="field"><label>Speaker Type</label><select name="Speaker Type"><option>Invited</option><option>Keynote</option><option>Oral</option><option>Poster</option><option>Contributed</option><option>Plenary</option><option>Inaugural Talks</option><option>Closing Remarks</option></select></div><div class="field"><label>Start Time</label><input name="Start Time" type="time"></div><div class="field"><label>End Time</label><input name="End Time" type="time"></div><div class="field full"><label>Speaker Name *</label><input name="Speaker Name" required></div><div class="field full"><label>Speaker Affiliation</label><input name="Speaker Affiliation"></div><div class="field full"><label>Talk Title *</label><input name="Talk Title" required></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field full"><label>Abstract / Description</label><textarea name="Abstract/Description"></textarea></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Talk</button><button class="secondary" type="button" onclick="resetForm('talkForm')">Clear</button><button class="secondary" type="button" onclick="loadAll()">Refresh Records</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Talks</h2><input id="talkSearch" placeholder="Search talks…"></div><div id="talksList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<p class="foot">ICEMD-2026 Programme Manager</p></main>
</div><!-- /managerApp -->
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec";
const SESSION_KEY = 'ICEMD_PROGRAM_MANAGER_SESSION_V1';
const SESSION_DURATION = 60 * 60 * 1000; // 1 hour
const state={days:[],sessions:[],talks:[],kind:'days'};
const $=id=>document.getElementById(id);
function showStatus(msg,ok=true){const el=$('globalStatus');el.textContent=msg;el.className='status '+(ok?'ok':'err');}
function apiUrl(){const u=API_URL.trim();if(!u||u.includes('PASTE_YOUR_'))throw new Error('Set your Apps Script Web App URL in the API_URL constant at the top of this script.');if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u))throw new Error('API_URL must be your deployed Apps Script Web App URL ending in /exec.');return u;}
function api(action,params={}){return new Promise((resolve,reject)=>{let url;try{url=new URL(apiUrl());}catch(e){reject(e);return;}url.searchParams.set('action',action);url.searchParams.set('callback','__icemd_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000));Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v==null?'':String(v)));const cb=url.searchParams.get('callback');const script=document.createElement('script');let done=false;const finish=()=>{if(done)return;done=true;delete window[cb];script.remove();};window[cb]=data=>{finish();if(data&&data.status==='error')reject(new Error(data.message||'Request failed'));else resolve(data);};script.onerror=()=>{finish();reject(new Error('Could not reach Apps Script. Check deployment access and URL.'));};script.src=url.toString();document.body.appendChild(script);setTimeout(()=>{if(!done){finish();reject(new Error('Request timed out.'));}},20000);});}
function formData(form){const o={};new FormData(form).forEach((v,k)=>o[k]=String(v).trim());return o;}
function setForm(form,obj={}){
 const f=$(form);f.reset();
 const currentId=obj.originalId||obj.id||obj['Day ID']||obj['Session ID']||obj['Talk ID']||'';
 f.elements.originalId.value=currentId;
 f.elements.id.value=currentId;
 Array.from(f.elements).forEach(el=>{
  if(el.name&&el.name!=='id'&&el.name!=='originalId'&&obj[el.name]!==undefined){
   let v=obj[el.name];
   if(el.type==='date'&&v)v=String(v).slice(0,10);
   if(el.type==='time'&&v)v=String(v).slice(0,5);
   el.value=v;
  }
 });
}
function resetForm(id){setForm(id,{});const titles={dayForm:'Add Conference Day',sessionForm:'Add Session',talkForm:'Add Talk / Speaker'};$(id.replace('Form','FormTitle')).textContent=titles[id]||'Add';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rowsTable(items,kind){
 if(!items.length)return '<div class="empty">No records yet.</div>';
 let cols;
 if(kind==='days')cols=['Day ID','Day Number','Date','Day Title','Status','Remarks'];
 else if(kind==='sessions')cols=['Session ID','Day ID','Session Category','Session Title','Start Time','End Time','Session Chair','Chair Affiliation','Venue','Session Order','Status','Show Publicly','Remarks','Last Updated'];
 else cols=['Talk ID','Session ID','Talk Order','Start Time','End Time','Speaker Name','Speaker Affiliation','Talk Title','Speaker Type','Abstract/Description','Status','Remarks','Last Updated'];
 let out='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>';
 items.forEach((r,i)=>{
  const id=String(r[cols[0]]??'');
  out+='<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+
   '<td><div class="rowactions">'+
   '<button class="secondary" type="button" onclick="editRecord(\''+kind+'\','+i+')">Edit</button>'+
   '<button class="danger" type="button" data-delete-kind="'+esc(kind)+'" data-delete-id="'+esc(id)+'">Delete</button>'+
   '</div></td></tr>';
 });
 return out+'</tbody></table>';
}
function sortRecordsById(items,idKey){
 return items.slice().sort((a,b)=>{
  const parse=v=>{const m=String(v||'').trim().match(/^(.*?)-(\\d+)$/);return m?{prefix:m[1].toLowerCase(),num:Number(m[2]),raw:String(v)}:{prefix:'',num:0,raw:String(v||'')};};
  const x=parse(a[idKey]),y=parse(b[idKey]);
  if(x.prefix&&x.prefix===y.prefix)return x.num-y.num;
  return x.raw.localeCompare(y.raw,undefined,{numeric:true,sensitivity:'base'});
 });
}
function render(){state.days=sortRecordsById(state.days,'Day ID');state.sessions=sortRecordsById(state.sessions,'Session ID');state.talks=sortRecordsById(state.talks,'Talk ID');const ds=state.days,ss=state.sessions,ts=state.talks;const dq=$('daySearch').value.toLowerCase(),sq=$('sessionSearch').value.toLowerCase(),tq=$('talkSearch').value.toLowerCase();$('daysList').innerHTML=rowsTable(ds.filter(r=>JSON.stringify(r).toLowerCase().includes(dq)),'days');$('sessionsList').innerHTML=rowsTable(ss.filter(r=>JSON.stringify(r).toLowerCase().includes(sq)),'sessions');$('talksList').innerHTML=rowsTable(ts.filter(r=>JSON.stringify(r).toLowerCase().includes(tq)),'talks');$('sessionDay').innerHTML='<option value="">Select day…</option>'+ds.map(d=>'<option value="'+esc(d['Day ID'])+'">'+esc(d['Day ID']+' · Day '+d['Day Number']+' · '+d.Date+' · '+d['Day Title'])+'</option>').join('');$('talkSession').innerHTML='<option value="">Select session…</option>'+ss.map(s=>'<option value="'+esc(s['Session ID'])+'">'+esc(s['Session ID']+' · '+s['Session Title'])+'</option>').join('');}
async function loadAll(){try{showStatus('Loading programme records…');const [d,s,t]=await Promise.all([api('getProgramDays'),api('getProgramSessions'),api('getProgramTalks')]);state.days=d.data||[];state.sessions=s.data||[];state.talks=t.data||[];render();showStatus('Connected. Loaded '+state.days.length+' days, '+state.sessions.length+' sessions and '+state.talks.length+' talks.');}catch(e){showStatus(e.message,false);}}
function editRecord(kind,index){const list=state[kind];const r=list[index];if(!r)return;if(kind==='days'){setForm('dayForm',{'id':r['Day ID'],'originalId':r['Day ID'],'Day Number':r['Day Number'],'Date':r.Date,'Day Title':r['Day Title'],'Status':r.Status,Remarks:r.Remarks});$('dayFormTitle').textContent='Edit Conference Day '+r['Day ID'];}else if(kind==='sessions'){setForm('sessionForm',{'id':r['Session ID'],'originalId':r['Session ID'],'Day ID':r['Day ID'],'Session Category':r['Session Category'],'Session Title':r['Session Title'],'Start Time':r['Start Time'],'End Time':r['End Time'],'Session Chair':r['Session Chair'],'Chair Affiliation':r['Chair Affiliation'],Venue:r.Venue,'Session Order':r['Session Order'],Status:r.Status,'Show Publicly':r['Show Publicly'],Remarks:r.Remarks});$('sessionFormTitle').textContent='Edit Session '+r['Session ID'];}else{setForm('talkForm',{'id':r['Talk ID'],'originalId':r['Talk ID'],'Session ID':r['Session ID'],'Talk Order':r['Talk Order'],'Start Time':r['Start Time'],'End Time':r['End Time'],'Speaker Name':r['Speaker Name'],'Speaker Affiliation':r['Speaker Affiliation'],'Talk Title':r['Talk Title'],'Speaker Type':r['Speaker Type'],'Abstract/Description':r['Abstract/Description'],Status:r.Status,Remarks:r.Remarks});$('talkFormTitle').textContent='Edit Talk '+r['Talk ID'];}window.scrollTo({top:0,behavior:'smooth'});}
async function removeRecord(kind,id){if(!confirm('Delete '+id+'? This cannot be undone.'))return;const action=kind==='days'?'deleteProgramDay':kind==='sessions'?'deleteProgramSession':'deleteProgramTalk';try{const r=await api(action,{id});showStatus(r.message||'Deleted.');await loadAll();}catch(e){showStatus(e.message,false);}}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-delete-kind][data-delete-id]');if(!btn)return;removeRecord(btn.dataset.deleteKind,btn.dataset.deleteId);});
function fetchRecordDetails(kind){
 const config={days:{input:'dayId',idKey:'Day ID',form:'dayForm'},sessions:{input:'sessionId',idKey:'Session ID',form:'sessionForm'},talks:{input:'talkId',idKey:'Talk ID',form:'talkForm'}}[kind];
 const entered=$(config.input).value.trim();
 if(!entered){showStatus('Please enter an ID first.',false);$(config.input).focus();return;}
 const list=state[kind];
 const index=list.findIndex(r=>String(r[config.idKey]??'').trim().toLowerCase()===entered.toLowerCase());
 if(index>=0){
  editRecord(kind,index);
  showStatus('ID '+entered+' already exists. Existing details have been loaded into the form. You may edit this record.');
 }else{
  $(config.form).elements.originalId.value='';
  showStatus('ID '+entered+' is available to add.',true);
 }
}
async function submitForm(e,formId,kind,addAction,updateAction){
 e.preventDefault();
 const p=formData($(formId));
 const editing=!!p.originalId;
 const idKey=kind==='days'?'Day ID':kind==='sessions'?'Session ID':'Talk ID';
 const enteredId=String(p.id||'').trim();
 const duplicate=state[kind].find(r=>String(r[idKey]??'').trim().toLowerCase()===enteredId.toLowerCase()&&String(r[idKey]??'').trim().toLowerCase()!==String(p.originalId||'').trim().toLowerCase());
 if(duplicate){showStatus('ID '+enteredId+' already exists. Use Fetch Details to load and edit the existing record.',false);return;}
 const action=editing?updateAction:addAction;
 if(!editing)p.originalId='';
 try{
  const r=await api(action,p);
  showStatus(r.message||'Saved successfully.');
  resetForm(formId);
  await loadAll();
 }catch(err){showStatus(err.message,false);}
}
$('dayForm').addEventListener('submit',e=>submitForm(e,'dayForm','days','addProgramDay','updateProgramDay'));
$('sessionForm').addEventListener('submit',e=>submitForm(e,'sessionForm','sessions','addProgramSession','updateProgramSession'));
$('talkForm').addEventListener('submit',e=>submitForm(e,'talkForm','talks','addProgramTalk','updateProgramTalk'));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.kind=b.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.kindPanel').forEach(x=>x.classList.add('hidden'));$(state.kind+'Panel').classList.remove('hidden');}));
['daySearch','sessionSearch','talkSearch'].forEach(id=>$(id).addEventListener('input',render));

function loginMessage(message,ok=false){
 const el=$('loginMessage');
 el.textContent=message;
 el.className='login-message '+(ok?'ok':'err');
}
function clearLoginMessage(){
 const el=$('loginMessage');
 el.textContent='';
 el.className='login-message';
}
function setLoginBusy(busy,buttonId,label){
 const btn=$(buttonId);
 btn.disabled=busy;
 if(busy) btn.dataset.oldText=btn.textContent;
 btn.textContent=busy?label:(btn.dataset.oldText||btn.textContent);
 if(!busy) delete btn.dataset.oldText;
}
async function sendManagerOTP(isResend=false){
 const email=(isResend?$('otpEmail').value:$('loginEmail').value).trim().toLowerCase();
 if(!email){loginMessage('Please enter your authorized admin email.');return;}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){loginMessage('Please enter a valid email address.');return;}
 clearLoginMessage();
 const buttonId=isResend?'resendOtpButton':'sendOtpButton';
 setLoginBusy(true,buttonId,isResend?'Sending OTP…':'Sending OTP…');
 try{
  const result=await api('requestProgramManagerOTP',{email});
  $('otpEmail').value=email;
  $('loginDetails').classList.add('hidden');
  $('loginOtpSection').classList.remove('hidden');
  $('sendOtpButton').classList.add('hidden');
  $('resendOtpButton').classList.remove('hidden');
  $('otpInput').value='';
  loginMessage(result.message||'OTP sent. It expires in 5 minutes.',true);
  $('otpInput').focus();
 }catch(err){
  loginMessage(err.message||'Unable to send OTP.');
 }finally{
  setLoginBusy(false,buttonId,'');
 }
}


function saveManagerSession(email) {
  const now = Date.now();

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    email: email,
    verifiedAt: now,
    expiresAt: now + SESSION_DURATION
  }));
}

function getManagerSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;

    const session = JSON.parse(raw);

    if (
      !session ||
      !session.email ||
      !Number.isFinite(session.expiresAt) ||
      session.expiresAt <= Date.now()
    ) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }

    return session;
  } catch (error) {
    return null;
  }
}

function clearManagerSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
  } catch (error) {}
}

function showManagerApp(email) {
  $('managerLogin').classList.add('hidden');
  $('managerApp').classList.remove('hidden');

  const accountEmail = email || '';
  $('loginEmail').value = accountEmail;
  $('loggedInEmail').textContent = accountEmail;

  loadAll();
}

function restoreManagerSession() {
  const session = getManagerSession();

  if (session) {
    showManagerApp(session.email);
  } else {
    clearManagerSession();
    $('managerLogin').classList.remove('hidden');
    $('managerApp').classList.add('hidden');
  }
}  

  
async function verifyManagerOTP() {
  const email = $('otpEmail').value.trim().toLowerCase();
  const otp = $('otpInput').value.trim();

  if (!/^\d{6}$/.test(otp)) {
    loginMessage('Enter the six-digit OTP sent to your email.');
    return;
  }

  clearLoginMessage();
  setLoginBusy(true, 'verifyOtpButton', 'Verifying OTP…');

  try {
    const result = await api('verifyProgramManagerOTP', {
      email: email,
      otp: otp
    });

    if (!result || result.success !== true) {
      throw new Error(
        (result && result.message) || 'OTP verification failed.'
      );
    }

    // Start the one-hour session only after successful OTP verification.
    saveManagerSession(email);

    showManagerApp(email);

  } catch (err) {
    loginMessage(err.message || 'OTP verification failed.');
  } finally {
    setLoginBusy(false, 'verifyOtpButton', '');
  }
}

  
$('sendOtpButton').addEventListener('click',()=>sendManagerOTP(false));
$('resendOtpButton').addEventListener('click',()=>sendManagerOTP(true));
$('verifyOtpButton').addEventListener('click',verifyManagerOTP);
$('backLoginButton').addEventListener('click',()=>{
 $('loginOtpSection').classList.add('hidden');
 $('loginDetails').classList.remove('hidden');
 $('sendOtpButton').classList.remove('hidden');
 $('resendOtpButton').classList.add('hidden');
 $('otpInput').value='';
 clearLoginMessage();
});
$('otpInput').addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,6);});
$('otpInput').addEventListener('keydown',e=>{if(e.key==='Enter')verifyManagerOTP();});
$('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')sendManagerOTP(false);});
window.addEventListener('load', restoreManagerSession);

function logoutManager() {
  if (!confirm('Are you sure you want to log out?')) return;

  clearManagerSession();

  $('managerApp').classList.add('hidden');
  $('managerLogin').classList.remove('hidden');

  $('loginDetails').classList.remove('hidden');
  $('loginOtpSection').classList.add('hidden');
  $('sendOtpButton').classList.remove('hidden');
  $('resendOtpButton').classList.add('hidden');

  $('otpInput').value = '';
  $('otpEmail').value = '';
  $('loginEmail').value = '';

  clearLoginMessage();
}

$('logoutButton').addEventListener('click', logoutManager);
$('backHomeButton').addEventListener('click', () => {
  window.location.href = 'index.html';
});
</script></body></html>
