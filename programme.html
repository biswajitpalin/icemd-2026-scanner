<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICEMD-2026 Programme Manager</title>
<style>
:root{--navy:#17365d;--green:#198754;--bg:#f3f5f9;--line:#dce3ed;--text:#172033;--muted:#64748b;--space:clamp(16px,1.6vw,28px)}
*{box-sizing:border-box}
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;width:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);font-size:16px;line-height:1.55}
header{width:100%;background:var(--navy);color:#fff;padding:clamp(16px,2vw,28px) clamp(16px,2.2vw,36px)}
header h1{font-size:clamp(21px,1.8vw,30px);line-height:1.2;margin:0 0 6px;font-weight:700}
header p{margin:0;color:#dce7f5;font-size:clamp(13px,1vw,16px)}
.wrap{width:100%;max-width:none;margin:0 auto;padding:clamp(18px,2vw,32px) clamp(16px,2.2vw,36px) 28px}
.notice{padding:12px 14px;border-radius:8px;margin-bottom:14px;background:#e9f1fb;color:#17365d;font-size:14px;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space)}
.tab,button{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;font-size:14px;min-height:40px;touch-action:manipulation}
.tab{background:#e1e7f0;color:var(--navy)}.tab.active{background:var(--navy);color:#fff}
button.primary{background:var(--navy);color:#fff}button.save{background:var(--green);color:#fff}button.secondary{background:#e7ebf1;color:#24334b}button.danger{background:#b42318;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(340px, min(32vw,480px)) minmax(0,1fr);gap:var(--space);align-items:start;width:100%}
.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,1.7vw,28px);box-shadow:0 3px 12px #1720330a}
.panel h2{font-size:clamp(19px,1.35vw,24px);line-height:1.35;margin:0 0 20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}
label{font-size:14px;font-weight:700;color:#42516a}
input,select,textarea{width:100%;max-width:100%;border:1px solid #cbd4e1;border-radius:9px;padding:12px 13px;font:inherit;background:#fff;color:var(--text);min-width:0;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8dc;outline-offset:1px;border-color:#789ac7}
textarea{min-height:82px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tablewrap{width:100%;max-width:100%;overflow:visible;overscroll-behavior-x:contain;border-radius:8px;min-width:0}.table-scroll-top,.table-scroll-bottom{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.table-scroll-top{height:19px;margin:0 0 8px;border:1px solid #e0e6ee;border-radius:8px;background:#f1f4f8}.table-scroll-top-inner{height:1px}.table-scroll-bottom{border:1px solid #e5eaf1;border-radius:8px}.table-scroll-top::-webkit-scrollbar,.table-scroll-bottom::-webkit-scrollbar{height:13px}.table-scroll-top::-webkit-scrollbar-thumb,.table-scroll-bottom::-webkit-scrollbar-thumb{background:#9299a3;border-radius:10px}.table-scroll-top::-webkit-scrollbar-track,.table-scroll-bottom::-webkit-scrollbar-track{background:#edf0f4;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px;table-layout:auto}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #e8edf3;vertical-align:top;overflow-wrap:anywhere;line-height:1.5}
th{background:#f1f4f8;color:#34435b;font-size:13px;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
.small{font-size:12px;color:#65738a}.record-title{font-weight:700;margin-bottom:4px}.rowactions{display:flex;gap:6px;flex-wrap:wrap;min-width:76px}.rowactions button{padding:7px 9px;min-height:32px;font-size:12px}
.status{margin:12px 0;padding:10px 12px;border-radius:7px;display:none;white-space:pre-wrap;overflow-wrap:anywhere}.status.ok{display:block;background:#e8f6ed;color:#17683a}.status.err{display:block;background:#fdeceb;color:#9f2018}.hidden{display:none!important}
.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}.toolbar h2{margin:0}.toolbar input{width:min(100%,380px);margin-left:auto}
.empty{padding:25px;text-align:center;color:#65738a}.foot{font-size:12px;color:#65738a;margin:16px 0 4px}
@media(min-width:1500px){.layout{grid-template-columns:minmax(340px, min(28vw,500px)) minmax(0,1fr)}.panel{padding:22px}table{font-size:14px}th,td{padding:12px}}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.layout>.panel:first-child{width:100%}.tablewrap{max-height:none}.panel{padding:20px}.table-scroll-top{height:18px}}
@media(max-width:640px){body{font-size:15px}header{padding:19px 16px}header h1{font-size:22px}.wrap{padding:16px 12px 22px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tab{padding:11px 5px;font-size:12px;min-height:44px}.layout{grid-template-columns:minmax(0,1fr);gap:14px}.panel{padding:16px;border-radius:11px}.panel h2{font-size:19px;margin-bottom:16px}.fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}input,select,textarea{font-size:16px;padding:11px}.toolbar{align-items:stretch}.toolbar h2{width:100%}.toolbar input{width:100%;max-width:none;margin:0}.tablewrap{margin:0}table{min-width:900px;font-size:13px}th,td{padding:10px 11px}.actions button{flex:1 1 auto}.status{font-size:14px}.table-scroll-top{margin-bottom:8px}}
@media(max-width:380px){.fields{grid-template-columns:minmax(0,1fr)}.field.full{grid-column:auto}.tabs{grid-template-columns:1fr}.tab{text-align:center}.actions button{width:100%}}
@media(orientation:landscape) and (max-height:520px) and (max-width:1000px){header{padding:10px 16px}.wrap{padding-top:10px}.layout{grid-template-columns:minmax(280px,38%) minmax(0,1fr)}.panel{padding:12px}}
</style></head><body>
<header><h1>ICEMD-2026 · Programme Manager</h1><p>Manage conference days, sessions, talks and speakers</p></header>
<main class="wrap"><div id="globalStatus" class="status"></div>
<div class="tabs"><button class="tab active" data-kind="days">Conference Days</button><button class="tab" data-kind="sessions">Sessions</button><button class="tab" data-kind="talks">Talks / Speakers</button></div>
<section id="daysPanel" class="kindPanel"><div class="layout"><div class="panel"><h2 id="dayFormTitle">Add Conference Day</h2><form id="dayForm"><input type="hidden" name="id"><div class="fields"><div class="field"><label>Day Number *</label><input name="Day Number" type="number" min="1" required></div><div class="field"><label>Date *</label><input name="Date" type="date" required></div><div class="field full"><label>Day Title</label><input name="Day Title" placeholder="e.g. Inauguration and Technical Sessions"></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Day</button><button class="secondary" type="button" onclick="resetForm('dayForm')">Clear</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Conference Days</h2><input id="daySearch" placeholder="Search days…"></div><div id="daysList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<section id="sessionsPanel" class="kindPanel hidden"><div class="layout"><div class="panel"><h2 id="sessionFormTitle">Add Session</h2><form id="sessionForm"><input type="hidden" name="id"><div class="fields"><div class="field full"><label>Conference Day *</label><select name="Day ID" id="sessionDay" required></select></div><div class="field"><label>Session Category</label><select name="Session Category"><option>Inauguration</option><option>Keynote</option><option>Invited Talk</option><option>Technical Session</option><option>Oral Session</option><option>Poster Session</option><option>Break</option><option>Lunch</option><option>Panel Discussion</option><option>Valedictory</option><option>Other</option></select></div><div class="field"><label>Session Order</label><input name="Session Order" type="number" min="1"></div><div class="field full"><label>Session Title *</label><input name="Session Title" required></div><div class="field"><label>Start Time</label><input name="Start Time" type="time"></div><div class="field"><label>End Time</label><input name="End Time" type="time"></div><div class="field"><label>Session Chair</label><input name="Session Chair"></div><div class="field"><label>Chair Affiliation</label><input name="Chair Affiliation"></div><div class="field full"><label>Venue</label><input name="Venue"></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field"><label>Show Publicly</label><select name="Show Publicly"><option>YES</option><option>NO</option></select></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Session</button><button class="secondary" type="button" onclick="resetForm('sessionForm')">Clear</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Sessions</h2><input id="sessionSearch" placeholder="Search sessions…"></div><div id="sessionsList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<section id="talksPanel" class="kindPanel hidden"><div class="layout"><div class="panel"><h2 id="talkFormTitle">Add Talk / Speaker</h2><form id="talkForm"><input type="hidden" name="id"><div class="fields"><div class="field full"><label>Session *</label><select name="Session ID" id="talkSession" required></select></div><div class="field"><label>Talk Order</label><input name="Talk Order" type="number" min="1"></div><div class="field"><label>Speaker Type</label><select name="Speaker Type"><option>Invited</option><option>Keynote</option><option>Oral</option><option>Poster</option><option>Contributed</option><option>Other</option></select></div><div class="field"><label>Start Time</label><input name="Start Time" type="time"></div><div class="field"><label>End Time</label><input name="End Time" type="time"></div><div class="field full"><label>Speaker Name *</label><input name="Speaker Name" required></div><div class="field full"><label>Speaker Affiliation</label><input name="Speaker Affiliation"></div><div class="field full"><label>Talk Title *</label><input name="Talk Title" required></div><div class="field"><label>Status</label><select name="Status"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="field full"><label>Abstract / Description</label><textarea name="Abstract/Description"></textarea></div><div class="field full"><label>Remarks</label><textarea name="Remarks"></textarea></div></div><div class="actions"><button class="save" type="submit">Save Talk</button><button class="secondary" type="button" onclick="resetForm('talkForm')">Clear</button></div></form></div><div class="panel"><div class="toolbar"><h2>Saved Talks</h2><input id="talkSearch" placeholder="Search talks…"></div><div id="talksList" class="tablewrap"><div class="empty">Connect to load records.</div></div></div></div></section>
<p class="foot">ICEMD-2026 Programme Manager</p></main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec";
const state={days:[],sessions:[],talks:[],kind:'days'};
const $=id=>document.getElementById(id);
function showStatus(msg,ok=true){const el=$('globalStatus');el.textContent=msg;el.className='status '+(ok?'ok':'err');}
function apiUrl(){const u=API_URL.trim();if(!u||u.includes('PASTE_YOUR_'))throw new Error('Set your Apps Script Web App URL in the API_URL constant at the top of this script.');if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u))throw new Error('API_URL must be your deployed Apps Script Web App URL ending in /exec.');return u;}
function api(action,params={}){return new Promise((resolve,reject)=>{let url;try{url=new URL(apiUrl());}catch(e){reject(e);return;}url.searchParams.set('action',action);url.searchParams.set('callback','__icemd_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000));Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v==null?'':String(v)));const cb=url.searchParams.get('callback');const script=document.createElement('script');let done=false;const finish=()=>{if(done)return;done=true;delete window[cb];script.remove();};window[cb]=data=>{finish();if(data&&data.status==='error')reject(new Error(data.message||'Request failed'));else resolve(data);};script.onerror=()=>{finish();reject(new Error('Could not reach Apps Script. Check deployment access and URL.'));};script.src=url.toString();document.body.appendChild(script);setTimeout(()=>{if(!done){finish();reject(new Error('Request timed out.'));}},20000);});}
function formData(form){const o={};new FormData(form).forEach((v,k)=>o[k]=String(v).trim());return o;}
function setForm(form,obj={}){const f=$(form);f.reset();f.elements.id.value=obj.id||obj['Day ID']||obj['Session ID']||obj['Talk ID']||'';Array.from(f.elements).forEach(el=>{if(el.name&&el.name!=='id'&&obj[el.name]!==undefined){let v=obj[el.name];if(el.type==='date'&&v)v=String(v).slice(0,10);if(el.type==='time'&&v)v=String(v).slice(0,5);el.value=v;}});}
function resetForm(id){setForm(id,{});const titles={dayForm:'Add Conference Day',sessionForm:'Add Session',talkForm:'Add Talk / Speaker'};$(id.replace('Form','FormTitle')).textContent=titles[id]||'Add';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rowsTable(items,kind){
  if(!items.length)return '<div class="empty">No records yet.</div>';
  let cols;
  if(kind==='days'){
    cols=['Day ID','Day Number','Date','Day Title','Status','Remarks'];
  }else if(kind==='sessions'){
    cols=['Session ID','Day ID','Session Category','Session Title','Start Time','End Time','Session Chair','Chair Affiliation','Venue','Session Order','Status','Show Publicly','Remarks','Last Updated'];
  }else{
    cols=['Talk ID','Session ID','Talk Order','Start Time','End Time','Speaker Name','Speaker Affiliation','Talk Title','Speaker Type','Abstract/Description','Status','Remarks','Last Updated'];
  }
  let out='<div class="table-scroll-top" aria-label="Scroll table horizontally"><div class="table-scroll-top-inner"></div></div><div class="table-scroll-bottom"><table><thead><tr>';
  out+=cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>';
  items.forEach((r,i)=>{
    const id=r[cols[0]];
    out+='<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+
      '<td><div class="rowactions"><button class="secondary" onclick="editRecord(\''+kind+'\','+i+')">Edit</button><button class="danger" onclick="removeRecord(\''+kind+'\','+JSON.stringify(String(id)).replace(/</g,'\\u003c')+')">Delete</button></div></td></tr>';
  });
  return out+'</tbody></table></div>';
}
function syncTopScrollbars(){
  document.querySelectorAll('.tablewrap').forEach(container=>{
    const top=container.querySelector('.table-scroll-top');
    const bottom=container.querySelector('.table-scroll-bottom');
    const inner=container.querySelector('.table-scroll-top-inner');
    const table=container.querySelector('table');
    if(!top||!bottom||!inner||!table)return;
    inner.style.width=table.scrollWidth+'px';
    top.scrollLeft=bottom.scrollLeft;
    if(!top.dataset.syncBound){
      top.addEventListener('scroll',()=>{bottom.scrollLeft=top.scrollLeft;});
      bottom.addEventListener('scroll',()=>{top.scrollLeft=bottom.scrollLeft;});
      top.dataset.syncBound='1';
    }
  });
} 
function render(){const ds=state.days,ss=state.sessions,ts=state.talks;const dq=$('daySearch').value.toLowerCase(),sq=$('sessionSearch').value.toLowerCase(),tq=$('talkSearch').value.toLowerCase();$('daysList').innerHTML=rowsTable(ds.filter(r=>JSON.stringify(r).toLowerCase().includes(dq)),'days');$('sessionsList').innerHTML=rowsTable(ss.filter(r=>JSON.stringify(r).toLowerCase().includes(sq)),'sessions');$('talksList').innerHTML=rowsTable(ts.filter(r=>JSON.stringify(r).toLowerCase().includes(tq)),'talks');syncTopScrollbars();$('sessionDay').innerHTML='<option value="">Select day…</option>'+ds.map(d=>'<option value="'+esc(d['Day ID'])+'">'+esc(d['Day ID']+' · Day '+d['Day Number']+' · '+d.Date+' · '+d['Day Title'])+'</option>').join('');$('talkSession').innerHTML='<option value="">Select session…</option>'+ss.map(s=>'<option value="'+esc(s['Session ID'])+'">'+esc(s['Session ID']+' · '+s['Session Title'])+'</option>').join('');}
async function loadAll(){try{showStatus('Loading programme records…');const [d,s,t]=await Promise.all([api('getProgramDays'),api('getProgramSessions'),api('getProgramTalks')]);state.days=d.data||[];state.sessions=s.data||[];state.talks=t.data||[];render();showStatus('Connected. Loaded '+state.days.length+' days, '+state.sessions.length+' sessions and '+state.talks.length+' talks.');}catch(e){showStatus(e.message,false);}}
function editRecord(kind,index){const list=state[kind];const r=list[index];if(!r)return;if(kind==='days'){setForm('dayForm',{'id':r['Day ID'],'Day Number':r['Day Number'],'Date':r.Date,'Day Title':r['Day Title'],'Status':r.Status,Remarks:r.Remarks});$('dayFormTitle').textContent='Edit Conference Day '+r['Day ID'];}else if(kind==='sessions'){setForm('sessionForm',{'id':r['Session ID'],'Day ID':r['Day ID'],'Session Category':r['Session Category'],'Session Title':r['Session Title'],'Start Time':r['Start Time'],'End Time':r['End Time'],'Session Chair':r['Session Chair'],'Chair Affiliation':r['Chair Affiliation'],Venue:r.Venue,'Session Order':r['Session Order'],Status:r.Status,'Show Publicly':r['Show Publicly'],Remarks:r.Remarks});$('sessionFormTitle').textContent='Edit Session '+r['Session ID'];}else{setForm('talkForm',{'id':r['Talk ID'],'Session ID':r['Session ID'],'Talk Order':r['Talk Order'],'Start Time':r['Start Time'],'End Time':r['End Time'],'Speaker Name':r['Speaker Name'],'Speaker Affiliation':r['Speaker Affiliation'],'Talk Title':r['Talk Title'],'Speaker Type':r['Speaker Type'],'Abstract/Description':r['Abstract/Description'],Status:r.Status,Remarks:r.Remarks});$('talkFormTitle').textContent='Edit Talk '+r['Talk ID'];}window.scrollTo({top:0,behavior:'smooth'});}
async function removeRecord(kind,id){if(!confirm('Delete '+id+'? This cannot be undone.'))return;const action=kind==='days'?'deleteProgramDay':kind==='sessions'?'deleteProgramSession':'deleteProgramTalk';try{const r=await api(action,{id});showStatus(r.message||'Deleted.');await loadAll();}catch(e){showStatus(e.message,false);}}
async function submitForm(e,formId,kind,addAction,updateAction){e.preventDefault();const p=formData($(formId));const editing=!!p.id;const action=editing?updateAction:addAction;try{const r=await api(action,p);showStatus(r.message||'Saved successfully.');resetForm(formId);await loadAll();}catch(err){showStatus(err.message,false);}}
$('dayForm').addEventListener('submit',e=>submitForm(e,'dayForm','days','addProgramDay','updateProgramDay'));
$('sessionForm').addEventListener('submit',e=>submitForm(e,'sessionForm','sessions','addProgramSession','updateProgramSession'));
$('talkForm').addEventListener('submit',e=>submitForm(e,'talkForm','talks','addProgramTalk','updateProgramTalk'));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.kind=b.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.kindPanel').forEach(x=>x.classList.add('hidden'));$(state.kind+'Panel').classList.remove('hidden');}));
['daySearch','sessionSearch','talkSearch'].forEach(id=>$(id).addEventListener('input',render));window.addEventListener('load',loadAll);
</script></body></html>
