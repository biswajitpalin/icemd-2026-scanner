<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ICEMD-2026 QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      text-align: center;
    }

    #qr-reader {
      width: 100%;
      margin-top: 20px;
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startButton {
      background: #198754;
      color: white;
    }

    #startButton:disabled {
      background: #999;
    }

    #stopButton {
      background: #666;
      color: white;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #eee;
      border-radius: 8px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h2>ICEMD-2026 QR Scanner</h2>

      <div id="qr-reader"></div>

      <div id="status">
        Press Start Scanner.
      </div>

      <button id="startButton" onclick="startScanner()">
        Start Scanner
      </button>

      <button id="stopButton" onclick="stopScanner()">
        Stop Scanner
      </button>

    </div>
  </div>

  <script>

    let scanner = null;
    let running = false;

    async function startScanner() {

      if (running) {
        return;
      }

      const status =
        document.getElementById("status");

      const startButton =
        document.getElementById("startButton");

      status.innerText =
        "Starting camera...";

      startButton.disabled = true;

      try {

        scanner =
          new Html5Qrcode("qr-reader");

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          function(decodedText) {

            console.log(
              "QR detected:",
              decodedText
            );

            status.innerText =
              "QR detected: " + decodedText;

          },

          function(errorMessage) {
            // Ignore scan errors
          }

        );

        running = true;

        startButton.disabled = false;

        status.innerText =
          "Camera active — point at the QR code.";

      }

      catch (error) {

        console.error(
          "Camera error:",
          error
        );

        running = false;

        startButton.disabled = false;

        status.innerText =
          "Camera failed: " +
          (error.message || error);

      }

    }


    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {
        await scanner.stop();
      }
      catch (e) {}

      try {
        await scanner.clear();
      }
      catch (e) {}

      scanner = null;

      running = false;

      document.getElementById(
        "qr-reader"
      ).innerHTML = "";

      document.getElementById(
        "status"
      ).innerText =
        "Scanner stopped.";

    }

  </script>

</body>
</html>
