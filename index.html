<style>

*{box-sizing:border-box}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;

.container{

width:100%;
padding:18px;
margin-top:15px;

color:white;

text-align:center;
border-radius:8px;
font-size:17px;
font-weight:normal;
transition:background .15s ease,transform .1s ease;
}

.option:hover{
background:#214a7a;
}

.option:active{
transform:scale(.99);
}

.option-title{
font-size:18px;
margin-bottom:5px;
}

.option-description{
font-size:14px;
