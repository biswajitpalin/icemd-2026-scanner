<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICEMD-2026 Invited Guest Arrivals</title>
<style>
:root{--navy:#17365d;--green:#198754;--bg:#f3f5f9;--line:#dce3ed;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);font-size:15px;line-height:1.45}
header{background:var(--navy);color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:clamp(20px,2vw,28px);margin:0}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#loggedEmail{overflow-wrap:anywhere;font-size:14px}
main{padding:18px;max-width:none;margin:auto}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:38px}
.primary{background:var(--navy);color:#fff}.save{background:var(--green);color:#fff}.secondary{background:#e7ebf1;color:#24334b}.danger{background:#b42318;color:#fff}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #17203308}
h2{font-size:20px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#42516a}
input,select,textarea{width:100%;min-width:0;border:1px solid #cbd4e1;border-radius:8px;padding:10px;font:inherit;background:#fff;color:var(--text);min-height:40px}
textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.status{padding:10px 12px;border-radius:7px;margin-bottom:14px;display:none;white-space:pre-wrap;overflow-wrap:anywhere}
.status.ok{display:block;background:#e8f6ed;color:#17683a}.status.err{display:block;background:#fdeceb;color:#9f2018}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.toolbar h2{margin:0}.toolbar input{max-width:340px}
.tablewrap{overflow:auto;width:100%;border-radius:6px}table{border-collapse:collapse;width:100%;min-width:1500px;font-size:13px}
th,td{text-align:left;padding:9px;border-bottom:1px solid #e8edf3;vertical-align:top;overflow-wrap:anywhere}
th{background:#f1f4f8;color:#34435b;white-space:nowrap;position:sticky;top:0}
.rowactions{display:flex;gap:5px;flex-wrap:wrap}.rowactions button{padding:7px 9px;font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){main{padding:10px}.card{padding:13px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{max-width:none;width:100%}header{padding:15px}}

/* Login UI matched to the Programme Manager page; guest-arrival wording and behavior remain specific to this page. */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(22px,4vw,34px);box-shadow:0 5px 20px #14273f1a}
.login-card h1{text-align:center;color:var(--navy);font-size:clamp(24px,3vw,30px);line-height:1.2;margin:0 0 8px;font-weight:700}
.login-card p{color:var(--navy);font-size:clamp(18px,2.3vw,23px);font-weight:700;text-align:center;margin:0 0 24px}
.login-card .field{margin:0}
.login-card label{display:block;font-size:14px;margin:16px 0 7px;color:#42516a;font-weight:700}
.login-card input{min-height:48px;font-size:16px;padding:10px 11px}
.login-card button{width:100%;margin-top:15px;min-height:48px;font-size:16px}
.login-card #guestBackButton{background:#666666;color:#ffffff}
.login-card #backLoginButton{background:#e7ebf1;color:#24334b}
.login-message{display:none;padding:12px;border-radius:8px;margin-top:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.login-message.ok{display:block;background:#e8f6ed;color:#17683a}
.login-message.err{display:block;background:#fdeceb;color:#9f2018}
#otpEmail{background:#e8f0fe;cursor:default}
.hidden{display:none!important}
@media(max-width:540px){.login-wrap{padding:14px}.login-card{padding:22px 18px}.login-card h1{font-size:26px}.login-card p{font-size:20px}.login-card input,.login-card button{font-size:16px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>ICEMD-2026</h1>
    <p>Invited Guest Arrivals Management</p>
    <div id="loginDetails">
      <div class="field"><label for="loginEmail">Authorized Email Address</label><input id="loginEmail" type="email" autocomplete="email" placeholder="Enter your authorized email"></div>
      <button class="primary" type="button" id="sendOtpButton">Send OTP</button>
      <button class="secondary" type="button" id="guestBackButton" onclick="window.location.href='./index.html'">Back</button>
    </div>
    <div id="otpSection" class="hidden">
      <div class="field"><label for="otpEmail">Authorized Email Address</label><input id="otpEmail" type="email" readonly aria-readonly="true"></div>
      <div class="field"><label for="otpInput">Six-digit OTP</label><input id="otpInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP received by email"></div>
      <button class="save" type="button" id="verifyOtpButton">Verify OTP &amp; Login</button>
      <button class="primary" type="button" id="resendOtpButton">Resend OTP</button>
      <button class="secondary" type="button" id="backLoginButton">Back</button>
    </div>
    <div id="loginMessage" class="login-message"></div>
  </div>
</section>
<div id="appShell" class="hidden">
<header>
  <h1>ICEMD-2026 · Invited Guest Arrivals</h1>
  <div class="header-actions"><span id="loggedEmail"></span><button class="secondary" id="backButton" type="button">Back to Home</button><button class="secondary" id="logoutButton" type="button">Logout</button></div>
</header>
<main>
  <div id="status" class="status"></div>
  <section class="card">
    <h2 id="formTitle">Add / Update Invited Guest Arrival</h2>
    <form id="arrivalForm">
      <div class="grid">
        <div class="field"><label for="regId">Registration ID *</label><input id="regId" name="Registration ID" required placeholder="Enter full registration ID"><button class="primary" type="button" id="fetchDetailsButton">Fetch Details</button></div>
        <div class="field"><label for="name">Name *</label><input id="name" name="Name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="Email" type="email"></div>
        <div class="field"><label for="institute">Institute</label><input id="institute" name="Institute"></div>
        <div class="field"><label for="arrivalStation">Arrival Station *</label><select id="arrivalStation" name="Arrival Station" required><option value="">Select Arrival Station</option><option>Airport</option><option>Railway Station</option><option>Bus Stop</option><option>Not Required</option></select></div>
        <div class="field"><label for="arrivalPlace">Arrival Place</label><input id="arrivalPlace" name="Arrival Place" placeholder="Enter airport / station / bus stop name"></div>
        <div class="field"><label for="arrivalDate">Arrival Date</label><input id="arrivalDate" name="Arrival Date" type="date"></div>
        <div class="field"><label for="arrivalTime">Arrival Time</label><input id="arrivalTime" name="Arrival Time" type="time"></div>
        <div class="field"><label for="hotel">Booked Hotel Name</label><select id="hotel" name="Booked Hotel Name"><option value="">Select hotel</option><option>Hotel-1</option><option>Hotel-2</option><option>Hotel-3</option><option>Hotel-4</option><option>Hotel-5</option><option>Hotel-6</option><option>Hotel-7</option><option>Hotel-8</option><option>Hotel-9</option><option>Hotel-10</option><option>Not Required</option></select></div>
        <div class="field"><label for="room">Room Allotted/Number</label><input id="room" name="Room Allotted/Number" placeholder="final decided or checked-in room number"></div>
        <div class="field"><label for="checkin">Check-in Status</label><select id="checkin" name="Check-in Status"><option value="">Select status</option><option>Booked, yet not arrived</option><option>Checked-In</option><option>Not Required</option></select></div>
        <div class="field"><label for="departureDate">Departure Date</label><input id="departureDate" name="Departure Date" type="date"></div>
        <div class="field"><label for="departureTime">Departure Time</label><input id="departureTime" name="Departure Time" type="time"></div>
        <div class="field"><label for="departureStatus">Departure Status</label><select id="departureStatus" name="Departure Status"><option value="">Select status</option><option>Planned</option><option>Departed</option><option>Stay Extended</option><option>Not Required</option></select></div>
        <div class="field full"><label for="remarks">Remarks</label><textarea id="remarks" name="Remarks"></textarea></div>
      </div>
      <div class="actions"><button class="save" type="submit" id="saveButton">Save Arrival Details</button><button class="secondary" type="button" id="clearButton">Clear Form</button><button class="secondary" type="button" id="refreshButton">Refresh Records</button></div>
      <div class="note">Saving an existing Registration ID updates that record. Last Updated is filled automatically in the spreadsheet.</div>
    </form>
  </section>
  <section class="card">
    <div class="toolbar"><h2>Saved Arrival Records</h2><input id="search" placeholder="Search ID, name, institute, hotel…"></div>
    <div id="records" class="tablewrap">Loading records…</div>
  </section>
</main>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec";
const SESSION_KEY="ICEMD_GUEST_ARRIVAL_SESSION_V1";
const $=id=>document.getElementById(id);
let records=[];
function api(action,params={}){return new Promise((resolve,reject)=>{let u;try{u=new URL(API_URL)}catch(e){reject(e);return}u.searchParams.set("action",action);u.searchParams.set("callback","__arrival_cb_"+Date.now()+"_"+Math.floor(Math.random()*100000));Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v==null?"":String(v)));const cb=u.searchParams.get("callback"),s=document.createElement("script");let done=false;const finish=()=>{if(done)return;done=true;delete window[cb];s.remove()};window[cb]=d=>{finish();if(d&&d.status==="error")reject(new Error(d.message||"Request failed"));else resolve(d)};s.onerror=()=>{finish();reject(new Error("Could not reach Apps Script. Check deployment access and URL."))};s.src=u.toString();document.body.appendChild(s);setTimeout(()=>{if(!done){finish();reject(new Error("Request timed out."))}},20000)})}
function showStatus(m,ok=true){const e=$("status");e.textContent=m;e.className="status "+(ok?"ok":"err")}
function session(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(s&&s.email&&Number(s.expiresAt)>Date.now())return s;try{localStorage.removeItem(SESSION_KEY)}catch(e){}return null}catch(e){return null}}
function requireSession(){const s=session();if(!s){$("appShell").classList.add("hidden");$("loginScreen").classList.remove("hidden");return false}$("loggedEmail").textContent=s.email;$("loginScreen").classList.add("hidden");$("appShell").classList.remove("hidden");return true}
function loginMessage(message,ok=false){const e=$("loginMessage");e.textContent=message;e.className="login-message "+(ok?"ok":"err")}
function setLoginBusy(busy,id,label){const e=$(id);e.disabled=busy;if(label)e.textContent=label;else e.textContent=id==="sendOtpButton"?"Send Login OTP":id==="verifyOtpButton"?"Verify OTP & Login":id==="resendOtpButton"?"Resend OTP":e.textContent}
async function sendArrivalOTP(resend=false){const email=$("loginEmail").value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){loginMessage("Enter a valid email address.");return}loginMessage("Sending OTP…",true);setLoginBusy(true,resend?"resendOtpButton":"sendOtpButton","Sending…");try{const r=await api("requestGuestArrivalOTP",{email});if(!r||r.success!==true)throw new Error(r&&r.message||"Could not send OTP.");$("otpEmail").value=email;$("otpSection").classList.remove("hidden");$("loginDetails").classList.add("hidden");loginMessage(r.message||"OTP sent. It is valid for 5 minutes.",true);$("otpInput").focus()}catch(e){loginMessage(e.message||"Unable to send OTP.")}finally{setLoginBusy(false,resend?"resendOtpButton":"sendOtpButton")}}
async function verifyArrivalOTP(){const email=$("loginEmail").value.trim().toLowerCase(),otp=$("otpInput").value.trim();if(!/^\d{6}$/.test(otp)){loginMessage("Enter the six-digit OTP sent to your email.");return}loginMessage("Verifying OTP…",true);setLoginBusy(true,"verifyOtpButton","Verifying…");try{const r=await api("verifyGuestArrivalOTP",{email,otp});if(!r||r.success!==true)throw new Error(r&&r.message||"OTP verification failed.");localStorage.setItem(SESSION_KEY,JSON.stringify({email:r.email||email,expiresAt:Date.now()+60*60*1000}));$("otpInput").value="";requireSession();await loadRecords();}catch(e){loginMessage(e.message||"OTP verification failed.")}finally{setLoginBusy(false,"verifyOtpButton")}}
$("sendOtpButton").addEventListener("click",()=>sendArrivalOTP(false));
$("resendOtpButton").addEventListener("click",()=>sendArrivalOTP(true));
$("verifyOtpButton").addEventListener("click",verifyArrivalOTP);
$("backLoginButton").addEventListener("click",()=>{$("otpSection").classList.add("hidden");$("loginDetails").classList.remove("hidden");$("otpInput").value="";$("otpEmail").value="";loginMessage("");});
$("otpInput").addEventListener("input",function(){this.value=this.value.replace(/[^0-9]/g,"").slice(0,6)});
$("otpInput").addEventListener("keydown",e=>{if(e.key==="Enter")verifyArrivalOTP()});
$("loginEmail").addEventListener("keydown",e=>{if(e.key==="Enter")sendArrivalOTP(false)});
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function formObject(){const o={};new FormData($("arrivalForm")).forEach((v,k)=>o[k]=String(v).trim());return o}
function clearForm(){ $("arrivalForm").reset(); $("formTitle").textContent="Add / Update Invited Guest Arrival"; }
function editRecord(id){const r=records.find(x=>String(x["Registration ID"]||"")===id);if(!r)return;clearForm();for(const el of $("arrivalForm").elements){if(el.name&&r[el.name]!==undefined){let v=r[el.name];if(el.type==="date"&&v)v=String(v).slice(0,10);if(el.type==="time"&&v)v=String(v).slice(0,5);el.value=v==null?"":v}}$("formTitle").textContent="Edit Arrival · "+id;window.scrollTo({top:0,behavior:"smooth"})}
function arrivalCompareIds(a,b){const left=String(a||"").trim(),right=String(b||"").trim();const lm=left.match(/^(.*?)-(\d+)$/),rm=right.match(/^(.*?)-(\d+)$/);if(lm&&rm&&lm[1].toLowerCase()===rm[1].toLowerCase())return Number(lm[2])-Number(rm[2]);return left.localeCompare(right,undefined,{numeric:true,sensitivity:"base"})}
function render(){const q=$("search").value.toLowerCase();const cols=["Registration ID","Name","Email","Institute","Arrival Station","Arrival Place","Arrival Date","Arrival Time","Booked Hotel Name","Room Allotted/Number","Check-in Status","Departure Date","Departure Time","Departure Status","Remarks","Last Updated"];const list=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).sort((a,b)=>arrivalCompareIds(a["Registration ID"],b["Registration ID"]));if(!list.length){$("records").innerHTML='<p style="padding:20px;color:#64748b">No arrival records found.</p>';return}let out="<table><thead><tr>"+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"<th>Actions</th></tr></thead><tbody>";list.forEach(r=>{const id=String(r["Registration ID"]||"");out+="<tr>"+cols.map(c=>"<td>"+esc(r[c])+"</td>").join("")+'<td><div class="rowactions"><button type="button" class="secondary" onclick="editRecord(\''+esc(id).replace(/'/g,"\\'")+'\')">Edit</button><button type="button" class="danger" onclick="deleteRecord(\''+esc(id).replace(/'/g,"\\'")+'\')">Delete</button></div></td></tr>'});$("records").innerHTML=out+"</tbody></table>"}
async function loadRecords(){try{showStatus("Loading arrival records…");const r=await api("getInvitedGuestArrivalRecords");records=r.data||[];render();showStatus("Loaded "+records.length+" invited guest arrival records.")}catch(e){showStatus(e.message,false)}}
function responseRows(r){
  if(Array.isArray(r)) return r;
  if(!r || typeof r!=="object") return [];
  for(const key of ["data","guests","invitedGuests","volunteers","records","rows","items"]){
    if(Array.isArray(r[key])) return r[key];
  }
  return [];
}
function normalizedRecord(row){
  if(Array.isArray(row)){
    return {
      "Registration ID":row[0]||"",
      "Name":row[1]||"",
      "Email":row[2]||"",
      "Institute":row[3]||""
    };
  }
  return row||{};
}
async function fetchRegistrationDetails(){
  const id=$("regId").value.trim().toLowerCase();
  if(!id){showStatus("Enter the full Registration ID first.",false);$("regId").focus();return}

  // Check the saved arrival records first to prevent duplicate arrival entries.
  const existingArrival=records.find(row=>String(row["Registration ID"]||"").trim().toLowerCase()===id);
  if(existingArrival){
    showStatus("Registration ID "+String(existingArrival["Registration ID"]||$("regId").value).trim()+" is already present in the saved arrival records. Use Edit in the records table to update this entry.",false);
    const searchBox=$("search");
    searchBox.value=String(existingArrival["Registration ID"]||"");
    render();
    return;
  }

  const btn=$("fetchDetailsButton");btn.disabled=true;btn.textContent="Fetching…";
  try{
    // Search all three registration categories using their existing read-only APIs.
    const results=await Promise.all([
      api("guests"),
      api("getInvitedGuests"),
      api("getVolunteers")
    ]);
    let found=null;
    for(const result of results){
      const rows=responseRows(result).map(normalizedRecord);
      found=rows.find(row=>{
        const rid=row["Registration ID"]??row.registrationId??row.registrationID??row["RegistrationID"]??row["Registration Id"]??row.id??"";
        return String(rid).trim().toLowerCase()===id;
      });
      if(found)break;
    }
    if(!found){
      showStatus("Registration ID not found in Participants (GUESTS), Invited Guests, or Volunteers. Check the full ID and try again.",false);
      return;
    }
    $("name").value=found["Name"]??found.name??"";
    $("email").value=found["Email"]??found.Email??found.email??found["Email id"]??found["Email ID"]??"";
    $("institute").value=found["Institute"]??found.institute??found["Institution"]??found.affiliation??"";
    showStatus("Registration details fetched successfully. Please complete the arrival information.");
  }catch(err){
    showStatus("Could not fetch registration details: "+(err.message||err),false);
  }finally{
    btn.disabled=false;btn.textContent="Fetch Details";
  }
}
$("fetchDetailsButton").addEventListener("click",fetchRegistrationDetails);
$("regId").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();fetchRegistrationDetails()}});
$("arrivalForm").addEventListener("submit",async e=>{e.preventDefault();if(!requireSession())return;const p=formObject();$("saveButton").disabled=true;try{const activeSession=session();if(!activeSession||!activeSession.email)throw new Error("Login session expired. Please log in again.");p["Updated By"]=activeSession.email;const r=await api("saveInvitedGuestArrivalRecord",p);showStatus(r.message||"Saved.");clearForm();await loadRecords()}catch(err){showStatus(err.message,false)}finally{$("saveButton").disabled=false}});
async function deleteRecord(id){if(!confirm("Delete arrival record for "+id+"? This cannot be undone."))return;try{const r=await api("deleteInvitedGuestArrivalRecord",{"Registration ID":id});showStatus(r.message||"Deleted.");await loadRecords()}catch(e){showStatus(e.message,false)}}
$("clearButton").addEventListener("click",clearForm);$("refreshButton").addEventListener("click",loadRecords);$("search").addEventListener("input",render);
$("logoutButton").addEventListener("click",()=>{localStorage.removeItem(SESSION_KEY);records=[];$("records").textContent="Login to view arrival records.";$("status").className="status";$("loginEmail").value="";$("otpInput").value="";$("otpSection").classList.add("hidden");$("loginDetails").classList.remove("hidden");loginMessage("");requireSession()});
$("backButton").addEventListener("click",()=>location.href="index.html");
try { if(requireSession()) loadRecords(); } catch (e) { console.error(e); loginMessage("Page initialization failed: " + (e.message || e)); }
</script>
</body></html>
