<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>ICEMD-2026 Food Scanner</title>

<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
></script>


<style>

*{
box-sizing:border-box
}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
min-height:90vh;
}

body.login-view{
display:flex;
align-items:center;
justify-content:center;
}

body.app-view{
display:block;
}

.container{
max-width:500px;
width:100%;
margin:0 auto;
}

.card{
background:white;
padding:22px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

h1{
text-align:center;
font-size:24px;
margin-top:0;
margin-bottom:5px
}

h2{
text-align:center;
font-size:20px;
margin-top:10px
}

h3{
text-align:center;
color:#17365d
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
background:white
}

input:focus,select:focus{
outline:none;
border-color:#17365d
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer
}

button:disabled{
background:#999!important;
cursor:not-allowed
}

.button{
background:#17365d;
color:white
}

.button:hover{
opacity:.92
}

.success-button{
background:#198754;
color:white
}

.secondary{
background:#666;
color:white
}

.danger{
background:#b02a37;
color:white
}

.message{
margin-top:15px;
padding:12px;
border-radius:7px;
text-align:center;
line-height:1.5;
display:none
}

.message.success{
display:block;
background:#d4edda;
color:#155724;
border:1px solid #b8dfc1
}

.message.error{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4
}

.welcome{
text-align:center;
font-weight:bold;
font-size:18px;
color:#17365d;
margin-bottom:15px
}

.food-info{
background:#eef3f8;
border-radius:8px;
padding:15px;
margin-top:15px;
font-size:15px;
line-height:1.6;
text-align:center
}

.food-info strong{
color:#17365d
}

.scanner-box{
width:100%;
margin-top:20px
}

#qr-reader{
width:100%
}

#qr-reader video{
width:100%!important;
height:auto!important;
border-radius:8px
}

.scan-result{
display:none;
margin-top:20px;
padding:20px;
border-radius:10px
}

.scan-accepted{
display:block;
background:#d4edda;
color:#155724;
border:1px solid #b8dfc1
}

.scan-duplicate{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4
}

.scan-invalid{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4
}

.scan-processing{
display:block;
background:#eef3f8;
color:#17365d;
border:1px solid #c9d5e2
}

.scan-result h2{
margin-top:0;
text-align:center
}

.scan-result p{
margin:8px 0;
font-size:14px;
line-height:1.5;
word-break:break-word
}

.hidden{
display:none!important
}

</style>

</head>


<body class="login-view">


<div class="container">


<!-- =====================================================
     FOOD LOGIN
====================================================== -->

<div
id="foodLoginPage"
class="card"
>

<h1>ICEMD-2026</h1>

<h2>Food Service Scanner</h2>

<p class="subtitle">
Food Distribution
</p>


<form
id="foodLoginForm"
onsubmit="foodLogin(event)"
autocomplete="on"
>


<label for="scannerName">
Counter
</label>


<!--
     Username field intentionally uses a text input.
     This allows Chrome/Edge password managers to
     recognize it as the username for the saved
     password.
-->

<input
type="text"
id="scannerName"
name="username"
list="scannerOptions"
placeholder="Select Counter"
autocomplete="username"
required
>


<datalist id="scannerOptions">

<option value="Food Counter 1">

<option value="Food Counter 2">

<option value="Food Counter 3">

</datalist>


<label for="scannerPassword">
Password
</label>


<input
type="password"
id="scannerPassword"
name="password"
placeholder="Enter scanner password"
autocomplete="current-password"
required
>


<button
id="loginButton"
type="submit"
class="button"
>
Login
</button>


</form>


<!-- BACK BUTTON -->

<button
type="button"
class="button secondary"
onclick="goHome()"
>
Back
</button>


<div
id="loginMessage"
class="message"
></div>

</div>



<!-- =====================================================
     FOOD SCANNER
====================================================== -->

<div
id="foodScannerPage"
class="card hidden"
>

<h1>ICEMD-2026</h1>

<h2>Food QR Scanner</h2>

<p
id="foodWelcome"
class="welcome"
></p>


<div class="food-info">

<div>
<strong>Active Food Service</strong>
</div>

<div id="foodServiceText">
Checking Admin setting...
</div>

</div>



<!-- CAMERA -->

<div class="scanner-box">

<div id="qr-reader"></div>

</div>



<!-- RESULT -->

<div
id="scanResult"
class="scan-result"
></div>



<!-- START -->

<button
id="startScannerButton"
class="button success-button"
onclick="startScanner()"
>
Start Scanner
</button>



<!-- LOGOUT -->

<button
type="button"
class="button danger"
onclick="logoutFoodScanner()"
>
Logout
</button>

</div>

</div>



<script>


/* =====================================================
   APPS SCRIPT URL
===================================================== */

const APPS_SCRIPT_URL=
"https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec";



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentScannerName="";

let scanner=null;

let scannerRunning=false;

let processingScan=false;



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =====================================================
   LOGIN MESSAGE
===================================================== */

function showLoginMessage(message,type){

const box=
document.getElementById("loginMessage");

box.innerText=message;

box.className=
"message "+
(type==="success"?"success":"error");

}



/* =====================================================
   VIEW CONTROL
===================================================== */

function setAppView(){

document.body.classList.remove("login-view");

document.body.classList.add("app-view");

}


function setLoginView(){

document.body.classList.remove("app-view");

document.body.classList.add("login-view");

}



/* =====================================================
   HOME / BACK
===================================================== */

function goHome(){

window.location.href="index.html";

}



/* =====================================================
   API REQUEST
===================================================== */

function apiRequest(params,callback){

const callbackName=
"icemdFoodCallback_"+
Date.now()+"_"+
Math.floor(Math.random()*100000);

const script=
document.createElement("script");

let finished=false;


window[callbackName]=function(data){

if(finished)return;

finished=true;

try{

delete window[callbackName];

}catch(error){}


if(script.parentNode){

script.parentNode.removeChild(script);

}


callback(data);

};


params.callback=callbackName;

const query=
new URLSearchParams(params);

script.src=
APPS_SCRIPT_URL+
"?"+
query.toString();


script.onerror=function(){

if(finished)return;

finished=true;

try{

delete window[callbackName];

}catch(error){}


if(script.parentNode){

script.parentNode.removeChild(script);

}


callback({

status:"error",

message:
"Unable to connect to the attendance server."

});

};


document.body.appendChild(script);

}



/* =====================================================
   FOOD LOGIN
===================================================== */

function foodLogin(event){

/*
 Prevent normal form submission.

 The form is deliberately kept as a real
 username/password form so Chrome/Edge can
 recognize the credentials and offer to
 save the password.
*/

if(event){

event.preventDefault();

}


const scannerName=
document.getElementById("scannerName")
.value
.trim();


/*
 Do NOT trim the password.

 The password is sent exactly as entered.
*/

const password=
document.getElementById("scannerPassword")
.value;


if(!scannerName||!password){

showLoginMessage(
"Please select Counter and enter password.",
"error"
);

return;

}


const button=
document.getElementById("loginButton");

button.disabled=true;

button.innerText="Checking...";


showLoginMessage(
"Checking scanner login...",
"success"
);


apiRequest({

action:"foodLogin",

name:scannerName,

password:password

},function(result){

console.log(
"Food login response:",
result
);


button.disabled=false;

button.innerText="Login";


if(
result&&
result.status==="success"
){


currentScannerName=
result.scanner||
result.name||
scannerName;


/*
 Keep the logged-in counter in session.

 This does NOT store the password.
*/

sessionStorage.setItem(
"icemdFoodScanner",
currentScannerName
);


document.getElementById(
"foodWelcome"
).innerText=
"Welcome, "+
currentScannerName;


document.getElementById(
"foodLoginPage"
).classList.add("hidden");


document.getElementById(
"foodScannerPage"
).classList.remove("hidden");


setAppView();


document.getElementById(
"scanResult"
).style.display="none";


document.getElementById(
"scanResult"
).innerHTML="";


processingScan=false;

scannerRunning=false;

scanner=null;


loadFoodService();


}else{


showLoginMessage(

result&&result.message
?
result.message
:
"Invalid scanner login.",

"error"

);

}

});

}



/* =====================================================
   LOAD ADMIN FOOD SERVICE
===================================================== */

function loadFoodService(){

const serviceText=
document.getElementById(
"foodServiceText"
);


serviceText.innerText=
"Checking Admin setting...";


apiRequest({

action:"getActiveFoodService"

},function(result){

console.log(
"Food service response:",
result
);


if(
result&&
result.status==="success"&&
result.active
){

serviceText.innerHTML=
"<strong>"+
escapeHtml(result.meal||"")+
"</strong>"+
"<br>"+
"Conference Date: "+
escapeHtml(result.date||"");

}else{

serviceText.innerHTML=
"<strong>No food service enabled.</strong>"+
"<br>"+
"Please ask Admin to enable a meal.";

}

});

}



/* =====================================================
   START QR SCANNER
===================================================== */

async function startScanner(){

if(
scannerRunning||
processingScan
)return;


const startButton=
document.getElementById(
"startScannerButton"
);


const resultBox=
document.getElementById(
"scanResult"
);


resultBox.style.display="none";

resultBox.innerHTML="";

resultBox.className="scan-result";


startButton.disabled=true;


try{


/* =====================================================
   CAMERA PERMISSION
===================================================== */

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Camera access is not supported by this browser."
);

}


const permissionStream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


permissionStream
.getTracks()
.forEach(function(track){

track.stop();

});



/* =====================================================
   CREATE SCANNER
===================================================== */

scanner=
new Html5Qrcode("qr-reader");



/* =====================================================
   START SCANNER
===================================================== */

await scanner.start(

{facingMode:"environment"},

{
fps:10,

qrbox:{
width:250,
height:250
}

},


async function(decodedText){

if(processingScan)return;

processingScan=true;


const registrationID=
String(decodedText||"").trim();


if(!registrationID){

processingScan=false;

return;

}


console.log(
"Food QR detected:",
registrationID
);



/* =====================================================
   SHOW VERIFYING STATE
===================================================== */

resultBox.className=
"scan-result scan-processing";

resultBox.style.display="block";

resultBox.innerHTML=
"<h2>Verifying QR...</h2>"+
"<p>Please wait while the food record is being checked.</p>";



/* =====================================================
   STOP CAMERA IMMEDIATELY
===================================================== */

try{

if(scanner){

await scanner.stop();

}

}catch(error){

console.error(
"Scanner stop error:",
error
);

}


try{

if(scanner){

await scanner.clear();

}

}catch(error){

console.error(
"Scanner clear error:",
error
);

}


scanner=null;

scannerRunning=false;

startButton.disabled=false;


processFoodScan(registrationID);

},


function(errorMessage){

/*
 QR scanning continues silently.
*/

}

);


scannerRunning=true;


}catch(error){

console.error(
"Camera start error:",
error
);


scanner=null;

scannerRunning=false;

processingScan=false;

startButton.disabled=false;


const cameraError=
error&&error.message
?
error.message
:
String(error);


document.getElementById(
"scanResult"
).innerHTML=
"<div class='scan-invalid'>"+
"<h2>✕ Camera Error</h2>"+
"<p>"+
escapeHtml(cameraError)+
"</p>"+
"<p>Please allow camera access and try again.</p>"+
"</div>";


document.getElementById(
"scanResult"
).style.display="block";

}

}



/* =====================================================
   PROCESS FOOD SCAN
===================================================== */

function processFoodScan(registrationID){

sendFoodScanToAppsScript(
registrationID
);

}



/* =====================================================
   SEND FOOD SCAN
===================================================== */

function sendFoodScanToAppsScript(
registrationID
){

apiRequest({

action:"scanFood",

registrationId:
registrationID,

scannedBy:
currentScannerName||""

},function(result){

console.log(
"Food Apps Script response:",
result
);


showFoodScanResult(result);

processingScan=false;

});

}



/* =====================================================
   SHOW FOOD RESULT
===================================================== */

function showFoodScanResult(result){

const box=
document.getElementById(
"scanResult"
);


box.style.display="block";

box.className="scan-result";


if(!result){

box.classList.add(
"scan-invalid"
);

box.innerHTML=
"<h2>✕ Food Scan Error</h2>"+
"<p>Unable to process this QR code.</p>";


box.scrollIntoView({

behavior:"smooth",

block:"start"

});


return;

}



/* =====================================================
   SUCCESS
===================================================== */

if(
result.status==="success"||
result.result==="SUCCESS"
){

box.classList.add(
"scan-accepted"
);


box.innerHTML=

"<h2>✓ Food Issued Successfully</h2>"+

"<p><b>Name:</b> "+
escapeHtml(
result.name||
"Not available"
)+
"</p>"+

"<p><b>Email:</b> "+
escapeHtml(
result.email||
"Not available"
)+
"</p>"+

"<p><b>Institute:</b> "+
escapeHtml(
result.institute||
"Not available"
)+
"</p>"+

"<p><b>Registration ID:</b> "+
escapeHtml(
result.registrationId||
result.registrationID||
"Not available"
)+
"</p>"+

"<p><b>Meal:</b> "+
escapeHtml(
result.meal||
"Not available"
)+
"</p>"+

"<p><b>Food Date:</b> "+
escapeHtml(
result.activeDate||
result.foodDate||
result.date||
"Not available"
)+
"</p>"+

"<p><b>Time:</b> "+
escapeHtml(
result.time||
"Not available"
)+
"</p>"+

"<p><b>Scanned By:</b> "+
escapeHtml(
result.scannedBy||
currentScannerName||
"Not available"
)+
"</p>";


box.scrollIntoView({

behavior:"smooth",

block:"start"

});


return;

}



/* =====================================================
   FAILED / DUPLICATE
===================================================== */

if(
result.status==="error"||
result.result==="FAILED"
){

box.classList.add(
"scan-duplicate"
);


box.innerHTML=

"<h2>✕ Food Not Issued</h2>"+

"<p><b>Registration ID:</b> "+
escapeHtml(
result.registrationId||
result.registrationID||
""
)+
"</p>"+

"<p><b>Name:</b> "+
escapeHtml(
result.name||
""
)+
"</p>"+

"<p><b>Email:</b> "+
escapeHtml(
result.email||
""
)+
"</p>"+

"<p><b>Institute:</b> "+
escapeHtml(
result.institute||
""
)+
"</p>"+

"<p><b>Meal:</b> "+
escapeHtml(
result.meal||
""
)+
"</p>"+

"<p><b>Reason:</b> "+
escapeHtml(
result.message||
result.reason||
"Food could not be issued."
)+
"</p>"+

"<p><b>Scanned By:</b> "+
escapeHtml(
result.scannedBy||
currentScannerName||
""
)+
"</p>";


box.scrollIntoView({

behavior:"smooth",

block:"start"

});


return;

}



/* =====================================================
   UNKNOWN RESPONSE
===================================================== */

box.classList.add(
"scan-invalid"
);


box.innerHTML=
"<h2>✕ Scan Error</h2>"+
"<p>"+
escapeHtml(
result.message||
"Unexpected server response."
)+
"</p>";


box.scrollIntoView({

behavior:"smooth",

block:"start"

});

}



/* =====================================================
   LOGOUT
===================================================== */

async function logoutFoodScanner(){

try{

if(scanner){

try{

await scanner.stop();

}catch(error){}


try{

await scanner.clear();

}catch(error){}

}

}catch(error){}


scanner=null;

scannerRunning=false;

processingScan=false;


currentScannerName="";


sessionStorage.removeItem(
"icemdFoodScanner"
);


document.getElementById(
"scannerName"
).value="";


/*
 Clear the password field on logout.

 The browser password manager can still
 retain its saved credential independently.
*/

document.getElementById(
"scannerPassword"
).value="";


document.getElementById(
"foodScannerPage"
).classList.add("hidden");


document.getElementById(
"foodLoginPage"
).classList.remove("hidden");


setLoginView();


document.getElementById(
"scanResult"
).style.display="none";


document.getElementById(
"scanResult"
).innerHTML="";


document.getElementById(
"loginMessage"
).className="message";


document.getElementById(
"loginMessage"
).innerText="";

}



/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
"load",
function(){

const savedScanner=
sessionStorage.getItem(
"icemdFoodScanner"
);


if(savedScanner){

currentScannerName=
savedScanner;


document.getElementById(
"foodWelcome"
).innerText=
"Welcome, "+
currentScannerName;


document.getElementById(
"foodLoginPage"
).classList.add("hidden");


document.getElementById(
"foodScannerPage"
).classList.remove("hidden");


setAppView();


loadFoodService();

}

});


</script>


</body>

</html>
