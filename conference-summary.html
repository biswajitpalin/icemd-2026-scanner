<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>ICEMD-2026 | Conference Summary</title>

<style>
:root {
  --navy: #17365d;
  --blue: #245b91;
  --blue-light: #eaf2fb;
  --bg: #f3f6fa;
  --line: #e1e7ef;
  --text: #182230;
  --muted: #627084;
  --green: #16845b;
  --red: #b42332;
  --white: #ffffff;
  --radius: 14px;
  --shadow: 0 3px 14px rgba(18, 38, 58, 0.055);
}

* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-wrap: break-word;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #7db8f0;
  outline-offset: 3px;
}

/* Main responsive container */

.wrap {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(12px, 2.2vw, 30px);
}

/* Header */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: clamp(17px, 2.4vw, 30px);
  color: var(--white);
  background: var(--navy);
  border-radius: var(--radius);
  box-shadow: 0 5px 18px rgba(23, 54, 93, 0.12);
}

.header-text {
  flex: 1 1 280px;
  min-width: 0;
}

.header h1 {
  margin: 0 0 7px;
  font-size: clamp(20px, 2.2vw, 29px);
  line-height: 1.25;
  letter-spacing: -0.4px;
  overflow-wrap: anywhere;
}

.header p {
  margin: 0;
  color: #dce8f6;
  font-size: clamp(12px, 1.1vw, 14px);
  line-height: 1.6;
}

.home-btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  flex: 0 0 auto;
  min-height: 44px;
  padding: 11px 16px;
  border-radius: 9px;
  background: var(--white);
  color: var(--navy);
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  transition: background 0.2s, transform 0.2s;
}

.home-btn:hover {
  background: #e7edf5;
}

.home-btn:active {
  transform: scale(0.98);
}

/* Status and refresh controls */

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin: 20px 0 8px;
}

.status {
  flex: 1 1 220px;
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.status.error {
  color: var(--red);
}

.refresh {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 11px 17px;
  border: none;
  border-radius: 9px;
  background: var(--green);
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.2s;
}

.refresh:hover {
  background: #116d4a;
}

.refresh:disabled {
  opacity: 0.65;
  cursor: wait;
}

/* Responsive navigation tabs */

.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0 15px;
}

.tab {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 46px;
  padding: 11px 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: #e7edf5;
  color: #24415f;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  white-space: normal;
  overflow-wrap: anywhere;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.tab:hover:not(.active) {
  background: #dce6f2;
}

.tab.active {
  background: var(--blue);
  color: var(--white);
  border-color: var(--blue);
}

/* Main content panels */

#content {
  min-width: 0;
}

.panel {
  min-width: 0;
  margin-bottom: 16px;
  padding: clamp(14px, 2vw, 24px);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  box-shadow: var(--shadow);
}

.panel h2 {
  margin: 0 0 7px;
  font-size: clamp(17px, 1.6vw, 21px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.note {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}

.empty {
  padding: clamp(24px, 5vw, 45px) 18px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
  line-height: 1.7;
}

.error {
  color: var(--red);
}

/* Tables: responsive scrolling without breaking columns */

.table-wrap {
  position: relative;
  width: 100%;
  max-width: 100%;
  overflow: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 9px;
  scrollbar-width: thin;
  scrollbar-color: #aab9cb #f1f4f8;
}

.table-wrap::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}

.table-wrap::-webkit-scrollbar-track {
  background: #f1f4f8;
  border-radius: 8px;
}

.table-wrap::-webkit-scrollbar-thumb {
  background: #aab9cb;
  border-radius: 8px;
}

table {
  width: 100%;
  min-width: max-content;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  line-height: 1.5;
}

th,
td {
  min-width: 90px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: right;
  vertical-align: middle;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #f0f4f9;
  color: #34465c;
  font-weight: 700;
}

th:first-child,
td:first-child {
  min-width: 135px;
  text-align: left;
}

/* Keep the first column visible when wide tables scroll */

th:first-child {
  position: sticky;
  left: 0;
  z-index: 4;
  background: #f0f4f9;
}

td:first-child {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--white);
}

tbody tr:nth-child(even):not(.total) td {
  background: #fbfcfe;
}

tbody tr:nth-child(even):not(.total) td:first-child {
  background: #fbfcfe;
}

tbody tr:hover td {
  background: #f0f6fd;
}

tbody tr:hover td:first-child {
  background: #f0f6fd;
}

tr:last-child td {
  border-bottom: 0;
}

tr.total td {
  font-weight: 700;
  background: #edf4fb;
}

tr.total td:first-child {
  background: #edf4fb;
}

/* Footer */

.foot {
  max-width: 850px;
  margin: 12px auto 0;
  padding: 10px 8px 20px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  text-align: center;
}

/* Loading state */

.loading #content {
  opacity: 0.65;
  pointer-events: none;
}

/* Tablet */

@media (max-width: 900px) {
  .wrap {
    padding: 16px;
  }

  .header {
    gap: 14px;
  }

  .tabs {
    gap: 8px;
  }

  .tab {
    padding: 11px 8px;
    font-size: 13px;
  }

  .panel {
    padding: 16px;
  }

  th,
  td {
    padding: 11px 12px;
  }
}

/* Mobile */

@media (max-width: 600px) {
  .wrap {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: 17px;
    border-radius: 11px;
  }

  .header-text {
    flex-basis: auto;
    width: 100%;
  }

  .header h1 {
    font-size: clamp(19px, 5.5vw, 24px);
    letter-spacing: -0.25px;
  }

  .header p {
    font-size: 12px;
  }

  .home-btn {
    align-self: flex-start;
    min-height: 44px;
    padding: 10px 13px;
  }

  .topline {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
  }

  .status {
    flex-basis: auto;
    font-size: 12px;
    line-height: 1.6;
  }

  .refresh {
    width: 100%;
    min-height: 46px;
  }

  .tabs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 13px 0;
  }

  .tab {
    min-height: 46px;
    padding: 10px 7px;
    font-size: 13px;
    border-radius: 9px;
  }

  .panel {
    margin-bottom: 12px;
    padding: 13px;
    border-radius: 10px;
  }

  .panel h2 {
    font-size: 17px;
  }

  .note {
    margin-bottom: 13px;
    font-size: 12px;
    line-height: 1.65;
  }

  .table-wrap {
    border-radius: 7px;
    max-height: 65vh;
  }

  table {
    font-size: 12px;
  }

  th,
  td {
    min-width: 78px;
    padding: 10px 10px;
    font-size: 12px;
  }

  th:first-child,
  td:first-child {
    min-width: 115px;
    max-width: 180px;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .empty {
    padding: 25px 12px;
    font-size: 13px;
  }

  .foot {
    padding: 8px 5px 18px;
    font-size: 11px;
  }
}

/* Small phones */

@media (max-width: 360px) {
  .wrap {
    padding: 7px;
  }

  .header {
    padding: 14px;
  }

  .header h1 {
    font-size: 19px;
  }

  .tabs {
    gap: 6px;
  }

  .tab {
    padding: 9px 5px;
    font-size: 12px;
  }

  .panel {
    padding: 10px;
  }

  th,
  td {
    padding: 9px 8px;
  }
}

/* Wide monitors */

@media (min-width: 1500px) {
  .wrap {
    max-width: 1500px;
  }
}

/* Respect users who prefer reduced motion */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <div class="header-text">
      <h1>ICEMD-2026 Conference Summary</h1>
      <p>Attendance · Food · Welcome Kits · Certificates</p>
    </div>

    <a class="home-btn" href="./index.html">
      ← Back to Home
    </a>
  </header>

  <div class="topline">
    <span id="status" class="status" aria-live="polite">
      Loading summary from existing records…
    </span>

    <button id="refreshBtn" class="refresh" type="button">
      ↻ Refresh summary
    </button>
  </div>

  <nav class="tabs" aria-label="Summary sections">
    <button class="tab active"
            type="button"
            data-tab="FOOD_SUMMARY"
            aria-pressed="true">
      Food
    </button>

    <button class="tab"
            type="button"
            data-tab="ATTENDANCE_SUMMARY"
            aria-pressed="false">
      Attendance
    </button>

    <button class="tab"
            type="button"
            data-tab="KIT_SUMMARY"
            aria-pressed="false">
      Welcome Kits
    </button>

    <button class="tab"
            type="button"
            data-tab="CERTIFICATE_SUMMARY"
            aria-pressed="false">
      Certificates
    </button>
  </nav>

  <main id="content" aria-live="polite" aria-busy="true">
    <div class="panel empty">
      Fetching latest summary…
    </div>
  </main>

  <footer class="foot">
    Counts are generated from existing successful records in the
    connected Google Sheet. Scan timestamps are not used to split
    meal counts.
  </footer>

</div>

<script>
(function () {
  'use strict';

  // Existing Apps Script endpoint retained.
  const API_URL =
    'https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec';

  const TITLES = {
    FOOD_SUMMARY: 'Food Distribution Summary',
    ATTENDANCE_SUMMARY: 'Attendance Summary',
    KIT_SUMMARY: 'Registration Welcome Kit Distribution',
    CERTIFICATE_SUMMARY: 'Certificate Distribution'
  };

  const NOTES = {
    FOOD_SUMMARY:
      'Counts are grouped by category, meal, and conference day.',

    ATTENDANCE_SUMMARY:
      'Count each person only once across the entire conference. Day columns show the day the person first had successful attendance recorded.',

    KIT_SUMMARY:
      'Participants and invited guests are counted from attendance records. Volunteers are counted only from the special Kit & Certificate scanner record.',

    CERTIFICATE_SUMMARY:
      'Participant and invited-guest counts come from successful CERTIFICATE records. Volunteers count only after the special Kit & Certificate scanner record.'
  };

  let summaryData = {};
  let currentTab = 'FOOD_SUMMARY';
  let loading = false;

  const content = document.getElementById('content');
  const status = document.getElementById('status');
  const refreshBtn = document.getElementById('refreshBtn');
  const tabButtons = Array.from(
    document.querySelectorAll('.tab')
  );

  /*
   * JSONP API request.
   * Retains compatibility with the existing Apps Script endpoint.
   */
  function api(action) {
    return new Promise(function (resolve, reject) {
      const cb =
        'icemdSummaryCb_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      const script = document.createElement('script');

      let finished = false;

      const timer = setTimeout(function () {
        finish();

        reject(
          new Error(
            'The summary service did not respond. Check the Apps Script deployment and try again.'
          )
        );
      }, 25000);

      function finish() {
        if (finished) return;

        finished = true;
        clearTimeout(timer);
        delete window[cb];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[cb] = function (data) {
        finish();
        resolve(data);
      };

      script.onerror = function () {
        finish();

        reject(
          new Error(
            'Could not connect to the summary service.'
          )
        );
      };

      script.src =
        API_URL +
        '?action=' + encodeURIComponent(action) +
        '&callback=' + encodeURIComponent(cb) +
        '&_=' + Date.now();

      document.body.appendChild(script);
    });
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(
      /[&<>"']/g,
      function (character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character];
      }
    );
  }

  function isTotal(row) {
    const value = String(row[0] || '').toLowerCase();

    return (
      value.includes('overall attendance') ||
      value.includes('grand total') ||
      value.includes('overall total')
    );
  }

  /*
   * Render the selected summary.
   * Table content remains unchanged; CSS handles responsiveness.
   */
  function render() {
    const rows = summaryData[currentTab] || [];

    if (!rows.length) {
      content.innerHTML =
        '<section class="panel empty">' +
        'No summary data returned yet. ' +
        'Click “Refresh summary” to try again.' +
        '</section>';

      return;
    }

    const title = TITLES[currentTab] || 'Conference Summary';
    const note = NOTES[currentTab] || '';

    // Find the actual table header in the generated sheet data.
    let headerIndex = rows.findIndex(function (row) {
      return (
        Array.isArray(row) &&
        row.some(function (cell) {
          return (
            String(cell || '').trim().toLowerCase() ===
            'category'
          );
        })
      );
    });

    if (headerIndex < 0) {
      headerIndex = rows.findIndex(function (row) {
        return Array.isArray(row) && row.length > 1;
      });
    }

    const headers = rows[headerIndex] || [];

    const body = rows
      .slice(headerIndex + 1)
      .filter(function (row) {
        return (
          Array.isArray(row) &&
          row.some(function (cell) {
            return String(
              cell == null ? '' : cell
            ).trim() !== '';
          })
        );
      });

    let html =
      '<section class="panel">' +
        '<h2>' + esc(title) + '</h2>' +
        '<p class="note">' + esc(note) + '</p>' +
        '<div class="table-wrap" role="region" ' +
        'aria-label="' + esc(title) + ' table" ' +
        'tabindex="0">' +
          '<table>' +
            '<thead><tr>';

    html += headers.map(function (header) {
      return '<th scope="col">' +
        esc(header) +
        '</th>';
    }).join('');

    html += '</tr></thead><tbody>';

    html += body.map(function (row) {
      return (
        '<tr' +
        (isTotal(row) ? ' class="total"' : '') +
        '>' +
        headers.map(function (_, index) {
          return (
            '<td>' +
            esc(
              row[index] === undefined
                ? ''
                : row[index]
            ) +
            '</td>'
          );
        }).join('') +
        '</tr>'
      );
    }).join('');

    html +=
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>';

    if (currentTab === 'FOOD_SUMMARY') {
      html +=
        '<section class="panel">' +
          '<p class="note" style="margin:0">' +
          'Meal names are taken from the food services ' +
          'configured in the system. Each meal has separate ' +
          'counts for volunteers, participants, and invited guests.' +
          '</p>' +
        '</section>';
    }

    content.innerHTML = html;
  }

  /*
   * Load or refresh summary data.
   */
  async function load() {
    if (loading) return;

    loading = true;

    refreshBtn.disabled = true;
    content.setAttribute('aria-busy', 'true');

    document.body.classList.add('loading');

    status.textContent = 'Refreshing from existing records…';
    status.classList.remove('error');

    try {
      const result = await api('getSummaryData');

      if (!result || result.status !== 'success') {
        throw new Error(
          result && result.message
            ? result.message
            : 'Summary could not be loaded.'
        );
      }

      summaryData = result.summaries || {};

      render();

      status.textContent =
        'Updated successfully · ' +
        new Date().toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });

    } catch (error) {
      status.textContent =
        error.message || 'Unable to load summary.';

      status.classList.add('error');

      content.innerHTML =
        '<section class="panel empty error">' +
          esc(status.textContent) +
          '<br><br>' +
          'Confirm that the Apps Script has been deployed ' +
          'with access allowed for this page, then refresh.' +
        '</section>';

    } finally {
      loading = false;

      refreshBtn.disabled = false;
      content.setAttribute('aria-busy', 'false');

      document.body.classList.remove('loading');
    }
  }

  /*
   * Tab selection.
   */
  tabButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      currentTab = button.dataset.tab;

      tabButtons.forEach(function (tab) {
        const active = tab === button;

        tab.classList.toggle('active', active);

        tab.setAttribute(
          'aria-pressed',
          String(active)
        );
      });

      render();
    });
  });

  refreshBtn.addEventListener('click', load);

  // Initial load.
  load();

})();
</script>

</body>
</html>
