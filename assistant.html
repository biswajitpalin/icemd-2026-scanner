<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ICEMD-2026 QR Attendance Scanner</title>


  <!-- HTML5 QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }


    .container {
      max-width: 500px;
      margin: auto;
    }


    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }


    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
    }


    h2 {
      text-align: center;
      font-size: 20px;
    }


    .welcome {
      text-align: center;
      font-weight: bold;
    }


    .info {
      background: #f0f0f0;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.5;
      margin-top: 15px;
    }


    #qr-reader {
      width: 100%;
      margin-top: 20px;
    }


    #qr-reader video {
      width: 100% !important;
      height: auto !important;
    }


    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }


    #startButton {
      background: #198754;
      color: white;
    }


    #stopButton {
      background: #666;
      color: white;
    }


    button:disabled {
      background: #999;
      cursor: not-allowed;
    }


    #status {
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #eee;
      border-radius: 8px;
      word-break: break-word;
      line-height: 1.5;
    }


    #result {
      margin-top: 15px;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }


    .hidden {
      display: none;
    }


    .input-group {
      margin-top: 15px;
    }


    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }


    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      box-sizing: border-box;
    }


    .note {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 15px;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">


    <h1>
      ICEMD-2026
    </h1>


    <h2>
      QR Attendance Scanner
    </h2>


    <p
      id="welcome"
      class="welcome">
      Registration Desk
    </p>


    <!-- ASSISTANT INFORMATION -->

    <div class="input-group">

      <label for="assistantName">
        Assistant Name
      </label>

      <input
        id="assistantName"
        type="text"
        placeholder="Assistant Name"
      >

    </div>


    <div class="input-group">

      <label for="assistantEmail">
        Assistant Email
      </label>

      <input
        id="assistantEmail"
        type="email"
        placeholder="Assistant Email"
      >

    </div>


    <!-- INFORMATION -->

    <div class="info">

      You are using the
      <strong>ICEMD-2026 QR Attendance Scanner.</strong>

      <br><br>

      Scan the guest's QR code using the camera.

      <br>

      The QR code contains only the
      <strong>Registration ID.</strong>

    </div>


    <!-- CAMERA -->

    <div id="qr-reader"></div>


    <!-- STATUS -->

    <div id="status">

      Click
      <strong>Start Scanner</strong>
      to activate the camera.

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="hidden">
    </div>


    <!-- BUTTONS -->

    <button
      id="startButton"
      onclick="startScanner()">

      Start Scanner

    </button>


    <button
      id="stopButton"
      onclick="stopScanner()">

      Stop Scanner

    </button>


    <div class="note">

      Camera runs directly on this page.

    </div>


  </div>


</div>



<script>


/* =====================================================
   APPS SCRIPT WEB APP
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/iitj.ac.in/s/AKfycbwRp-RAfstklkMP7Xmg0f5O46AxMMiODytXNXyJPK0sYHcdOZpNOgZQmYxRQAd66pTv/exec";


/* =====================================================
   SCANNER VARIABLES
   ===================================================== */

let scanner = null;

let running = false;

let processing = false;


/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner() {


  if (running || processing) {
    return;
  }


  const status =
    document.getElementById("status");


  const startButton =
    document.getElementById("startButton");


  status.innerText =
    "Starting camera...";


  startButton.disabled =
    true;


  try {


    /*
     * Create QR scanner.
     */

    scanner =
      new Html5Qrcode(
        "qr-reader"
      );


    /*
     * THIS IS THE CAMERA
     * INITIALIZATION FROM
     * YOUR PREVIOUSLY WORKING
     * GITHUB SCANNER.
     */

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      async function(decodedText) {


        if (processing) {
          return;
        }


        processing = true;


        const registrationID =
          String(
            decodedText || ""
          ).trim();


        if (!registrationID) {

          processing = false;

          return;

        }


        console.log(
          "QR detected:",
          registrationID
        );


        status.innerText =
          "QR detected: " +
          registrationID +
          "\nProcessing attendance...";


        /*
         * Stop camera.
         */

        try {

          if (scanner) {
            await scanner.stop();
          }

        }

        catch(error) {

          console.error(
            "Scanner stop error:",
            error
          );

        }


        try {

          if (scanner) {
            await scanner.clear();
          }

        }

        catch(error) {

          console.error(
            "Scanner clear error:",
            error
          );

        }


        scanner = null;

        running = false;


        /*
         * Process attendance.
         */

        processScan(
          registrationID
        );

      },


      function(errorMessage) {

        /*
         * Continuous QR scanning errors
         * are normal and ignored.
         */

      }

    );


    running = true;


    status.innerHTML =
      "<strong>Camera active.</strong><br>" +
      "Point the camera at the guest QR code.";


    console.log(
      "Camera started successfully."
    );


  }

  catch(error) {


    console.error(
      "Camera start error:",
      error
    );


    scanner = null;

    running = false;

    processing = false;


    startButton.disabled =
      false;


    status.innerHTML =
      "<strong>Camera failed to start.</strong><br><br>" +
      (
        error.message ||
        String(error)
      );

  }

}


/* =====================================================
   PROCESS QR
   ===================================================== */

function processScan(
  registrationID
) {


  const status =
    document.getElementById("status");


  status.innerText =
    "QR detected: " +
    registrationID +
    "\n\nVerifying registration...";


  sendScanToAppsScript(
    registrationID
  );

}


/* =====================================================
   SEND SCAN TO APPS SCRIPT
   ===================================================== */

function sendScanToAppsScript(
  registrationID
) {


  const assistantName =
    document
      .getElementById("assistantName")
      .value
      .trim();


  const assistantEmail =
    document
      .getElementById("assistantEmail")
      .value
      .trim();


  if (!assistantName) {

    showResult({

      result: "INVALID",

      message:
        "Assistant name is missing."

    });

    processing = false;

    return;

  }


  if (!assistantEmail) {

    showResult({

      result: "INVALID",

      message:
        "Assistant email is missing."

    });

    processing = false;

    return;

  }


  /*
   * Unique JSONP callback.
   */

  const callbackName =
    "icemdScanCallback_" +
    Date.now();


  /*
   * Create callback.
   */

  window[callbackName] =
    function(data) {


      console.log(
        "Apps Script response:",
        data
      );


      /*
       * Remove callback.
       */

      try {

        delete window[
          callbackName
        ];

      }

      catch(error) {}


      /*
       * Remove script.
       */

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(script);

      }


      /*
       * Show result.
       */

      showResult(data);


      processing = false;

    };


  /*
   * Build URL.
   */

  const params =
    new URLSearchParams();


  params.append(
    "action",
    "scan"
  );


  params.append(
    "registrationID",
    registrationID
  );


  params.append(
    "assistantName",
    assistantName
  );


  params.append(
    "assistantEmail",
    assistantEmail
  );


  params.append(
    "callback",
    callbackName
  );


  /*
   * Create script tag.
   */

  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    params.toString();


  /*
   * Connection failure.
   */

  script.onerror =
    function() {


      console.error(
        "Apps Script connection failed."
      );


      try {

        delete window[
          callbackName
        ];

      }

      catch(error) {}


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(script);

      }


      showResult({

        result: "INVALID",

        message:
          "Unable to connect to attendance server."

      });


      processing = false;

    };


  /*
   * Send request.
   */

  document.body.appendChild(
    script
  );

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showResult(
  data
) {


  const resultBox =
    document.getElementById(
      "result"
    );


  const status =
    document.getElementById(
      "status"
    );


  resultBox.classList
    .remove("hidden");


  if (!data) {

    resultBox.innerHTML =
      "❌ Unable to verify registration.";

    return;

  }


  const result =
    String(
      data.result || ""
    ).toUpperCase();


  const message =
    String(
      data.message || ""
    );


  if (
    result === "ACCEPTED"
  ) {


    resultBox.innerHTML =
      "✅ ATTENDANCE RECORDED<br><br>" +
      message;


    status.innerHTML =
      "Attendance recorded successfully.<br>" +
      "Click <strong>Start Scanner</strong> for the next guest.";


  }


  else if (
    result === "DUPLICATE"
  ) {


    resultBox.innerHTML =
      "⚠️ ALREADY SCANNED<br><br>" +
      message;


    status.innerHTML =
      "This guest has already been marked present.<br>" +
      "You may scan the next guest.";


  }


  else {


    resultBox.innerHTML =
      "❌ INVALID REGISTRATION<br><br>" +
      message;


    status.innerHTML =
      "Registration could not be verified.<br>" +
      "You may scan the next guest.";

  }

}


/* =====================================================
   STOP SCANNER
   ===================================================== */

async function stopScanner() {


  processing = false;


  if (scanner) {


    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "Scanner stop:",
        error
      );

    }


    try {

      await scanner.clear();

    }

    catch(error) {

      console.log(
        "Scanner clear:",
        error
      );

    }

  }


  scanner = null;

  running = false;


  document
    .getElementById(
      "qr-reader"
    )
    .innerHTML = "";


  document
    .getElementById(
      "startButton"
    )
    .disabled = false;


  document
    .getElementById(
      "status"
    )
    .innerText =
      "Scanner stopped. Click Start Scanner to activate the camera.";

}

</script>


</body>

</html>
