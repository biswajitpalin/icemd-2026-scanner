<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
ICEMD-2026 Assistant Login
</title>

<!-- QR SCANNER LIBRARY -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

.container{
max-width:500px;
margin:0 auto;
}

.card{
background:white;
padding:22px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1{
text-align:center;
font-size:24px;
margin-top:0;
margin-bottom:5px;
}

h2{
text-align:center;
font-size:20px;
margin-top:10px;
}

h3{
text-align:center;
color:#17365d;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#17365d;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:disabled{
background:#999!important;
cursor:not-allowed;
}

.button{
background:#17365d;
color:white;
}

.button:hover{
opacity:.92;
}

.success-button{
background:#198754;
color:white;
}

.secondary{
background:#666;
color:white;
}

.danger{
background:#b02a37;
color:white;
}

.message{
margin-top:15px;
padding:12px;
border-radius:7px;
text-align:center;
line-height:1.5;
display:none;
}

.message.success{
display:block;
background:#d4edda;
color:#155724;
border:1px solid #b8dfc1;
}

.message.error{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4;
}

.otp-note{
text-align:center;
color:#555;
line-height:1.5;
background:#eef3f8;
padding:12px;
border-radius:7px;
}

.welcome{
text-align:center;
font-weight:bold;
font-size:18px;
color:#17365d;
margin-bottom:15px;
}

.scanner-info{
background:#eef3f8;
border-radius:8px;
padding:15px;
margin-top:15px;
font-size:14px;
line-height:1.5;
text-align:center;
}

.scanner-box{
width:100%;
margin-top:20px;
}

#qr-reader{
width:100%;
}

#qr-reader video{
width:100%!important;
height:auto!important;
border-radius:8px;
}

.scanner-status{
margin-top:15px;
padding:12px;
border-radius:7px;
background:#eef3f8;
color:#17365d;
text-align:center;
font-size:14px;
line-height:1.5;
white-space:pre-line;
}

.scan-result{
display:none;
margin-top:20px;
padding:20px;
border-radius:10px;
}

.scan-accepted{
display:block;
background:#d4edda;
color:#155724;
border:1px solid #b8dfc1;
}

.scan-duplicate{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4;
}

.scan-invalid{
display:block;
background:#f8d7da;
color:#721c24;
border:1px solid #f1bfc4;
}

.scan-processing{
display:block;
background:#eef3f8;
color:#17365d;
border:1px solid #c9d5e2;
}

.scan-result h2{
margin-top:0;
text-align:center;
}

.scan-result p{
margin:8px 0;
font-size:14px;
line-height:1.5;
word-break:break-word;
}

.manual-test{
margin-top:25px;
padding-top:20px;
border-top:1px solid #ddd;
}

.manual-note{
font-size:13px;
color:#666;
text-align:center;
line-height:1.5;
}

.camera-note{
margin-top:12px;
font-size:12px;
color:#666;
text-align:center;
line-height:1.5;
}

.hidden{
display:none!important;
}

.loading{
opacity:.7;
}

</style>

</head>

<body>

<div class="container">


<!-- =================================================
     ASSISTANT LOGIN PAGE
================================================== -->

<div
id="assistantLoginPage"
class="card"
>

<h1>
ICEMD-2026
</h1>

<h2>
Assistant Login
</h2>

<p class="subtitle">
Registration Desk
</p>


<!-- ASSISTANT DETAILS -->

<div id="assistantDetails">

<label for="assistantName">
Name
</label>

<input
type="text"
id="assistantName"
placeholder="Enter your full name"
autocomplete="name"
>


<label for="assistantEmail">
Email
</label>

<input
type="email"
id="assistantEmail"
placeholder="Enter email address"
autocomplete="email"
>


<button
id="continueButton"
class="button"
onclick="requestOTP()"
>
Continue
</button>

</div>


<!-- OTP -->

<div
id="assistantOTP"
class="hidden"
>

<p class="otp-note">

An OTP has been sent to your
registered email address.

<br><br>

The OTP is valid for
<strong>5 minutes.</strong>

</p>


<label for="assistantOTPInput">
Enter OTP
</label>

<input
type="text"
id="assistantOTPInput"
maxlength="6"
inputmode="numeric"
autocomplete="one-time-code"
placeholder="6-digit OTP"
>


<button
id="verifyButton"
class="button"
onclick="verifyOTP()"
>
Verify OTP
</button>


<button
id="backDetailsButton"
class="button secondary"
onclick="backToAssistantDetails()"
>
Back
</button>

</div>


<button
id="assistantBackButton"
class="button secondary"
onclick="goHome()"
>
Back
</button>


<div
id="assistantMessage"
class="message"
></div>

</div>



<!-- =================================================
     ASSISTANT SCANNER PAGE
================================================== -->

<div
id="assistantScannerPage"
class="card hidden"
>

<h1>
ICEMD-2026
</h1>

<h2>
QR Attendance Scanner
</h2>


<p
id="assistantWelcome"
class="welcome"
></p>


<!-- CAMERA -->

<div class="scanner-box">

<div id="qr-reader"></div>

</div>


<!-- RESULT -->

<div
id="scanResult"
class="scan-result"
></div>


<!-- START -->

<button
id="startScannerButton"
class="button success-button"
onclick="startScanner()"
>
Start Scanner
</button>


<!-- LOGOUT -->

<button
class="button danger"
onclick="logoutAssistant()"
>
Logout
</button>

</div>


</div>



<script>


/* =====================================================
   APPS SCRIPT URL
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxD0VHRLp17LUYiPlYzxPRWwsZUagkVZycolhHfn6Nyt6XN-N2bQD0_uekzWlZc3iOgrA/exec";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentAssistantName="";

let currentAssistantEmail="";

let scanner=null;

let scannerRunning=false;

let processingScan=false;



/* =====================================================
   HELPER: SHOW MESSAGE
===================================================== */

function showMessage(message,type){

const box=
document.getElementById(
"assistantMessage"
);

box.innerText=message;

box.className=
"message "+
(
type==="success"
?"success"
:"error"
);

}



/* =====================================================
   HELPER: CLEAR MESSAGE
===================================================== */

function clearMessage(){

const box=
document.getElementById(
"assistantMessage"
);

box.innerText="";

box.className="message";

}



/* =====================================================
   HELPER: ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value??""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}



/* =====================================================
   ASSISTANT REQUEST OTP
===================================================== */

function requestOTP(){

const name=
document
.getElementById(
"assistantName"
)
.value
.trim();

const email=
document
.getElementById(
"assistantEmail"
)
.value
.trim()
.toLowerCase();


/* Validate fields */

if(
!name||
!email
){

showMessage(
"Please enter Name and Email.",
"error"
);

return;

}


/* Disable button */

const button=
document.getElementById(
"continueButton"
);

button.disabled=true;

button.innerText="Checking...";

showMessage(
"Checking assistant details...",
"success"
);


/* Create JSONP callback */

const callbackName=
"icemdAssistantOTP_"+
Date.now();

let script=
document.createElement(
"script"
);


/* JSONP callback */

window[callbackName]=
function(data){

console.log(
"Assistant OTP response:",
data
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

button.disabled=false;

button.innerText="Continue";

if(
data&&
data.success
){

/* Hide details */

document
.getElementById(
"assistantDetails"
)
.classList
.add(
"hidden"
);


/* Show OTP */

document
.getElementById(
"assistantOTP"
)
.classList
.remove(
"hidden"
);


/* Hide page Back button */

document
.getElementById(
"assistantBackButton"
)
.classList
.add(
"hidden"
);


/* Clear OTP field */

document
.getElementById(
"assistantOTPInput"
)
.value="";

showMessage(
data.message||
"OTP has been sent to your email address.",
"success"
);


/* Put cursor in OTP field */

setTimeout(
function(){

document
.getElementById(
"assistantOTPInput"
)
.focus();

},
100
);

}

else{

showMessage(
data&&data.message
?data.message
:"Unable to send OTP.",
"error"
);

}

};


/* Build request */

const params=
new URLSearchParams();

params.append(
"action",
"requestAssistantOTP"
);

params.append(
"name",
name
);

params.append(
"email",
email
);

params.append(
"callback",
callbackName
);


/* Send request */

script.src=
APPS_SCRIPT_URL+
"?"+
params.toString();


/* Connection error */

script.onerror=
function(){

console.error(
"Assistant OTP connection failed."
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

button.disabled=false;

button.innerText="Continue";

showMessage(
"Unable to connect to the attendance server.",
"error"
);

};

document.body.appendChild(
script
);

}



/* =====================================================
   VERIFY OTP
===================================================== */

function verifyOTP(){

const email=
document
.getElementById(
"assistantEmail"
)
.value
.trim()
.toLowerCase();

const otp=
document
.getElementById(
"assistantOTPInput"
)
.value
.trim();


/* Validate OTP */

if(!otp){

showMessage(
"Please enter the OTP.",
"error"
);

return;

}


/* Disable button */

const button=
document.getElementById(
"verifyButton"
);

button.disabled=true;

button.innerText="Verifying...";

showMessage(
"Verifying OTP...",
"success"
);


/* Create JSONP callback */

const callbackName=
"icemdVerifyOTP_"+
Date.now();

let script=
document.createElement(
"script"
);


/* JSONP callback */

window[callbackName]=
function(data){

console.log(
"OTP verification response:",
data
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

button.disabled=false;

button.innerText="Verify OTP";

if(
data&&
data.success
){

/* Save assistant identity */

currentAssistantName=
data.name||
"Assistant";

currentAssistantEmail=
data.email||
email;


/* Welcome message */

document
.getElementById(
"assistantWelcome"
)
.innerText=
"Welcome, "+
currentAssistantName;


/* Hide login */

document
.getElementById(
"assistantLoginPage"
)
.classList
.add(
"hidden"
);


/* Show scanner */

document
.getElementById(
"assistantScannerPage"
)
.classList
.remove(
"hidden"
);


/* Reset scanner state */

document
.getElementById(
"scanResult"
)
.style
.display="none";

document
.getElementById(
"scanResult"
)
.innerHTML="";

processingScan=false;

scannerRunning=false;

scanner=null;

}

else{

showMessage(
data&&data.message
?data.message
:"Incorrect OTP.",
"error"
);

}

};


/* Build request */

const params=
new URLSearchParams();

params.append(
"action",
"verifyAssistantOTP"
);

params.append(
"email",
email
);

params.append(
"otp",
otp
);

params.append(
"callback",
callbackName
);


/* Send request */

script.src=
APPS_SCRIPT_URL+
"?"+
params.toString();


/* Connection error */

script.onerror=
function(){

console.error(
"OTP verification connection failed."
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

button.disabled=false;

button.innerText="Verify OTP";

showMessage(
"Unable to connect to the attendance server.",
"error"
);

};

document.body.appendChild(
script
);

}



/* =====================================================
   BACK TO ASSISTANT DETAILS
===================================================== */

function backToAssistantDetails(){

document
.getElementById(
"assistantOTP"
)
.classList
.add(
"hidden"
);

document
.getElementById(
"assistantDetails"
)
.classList
.remove(
"hidden"
);

document
.getElementById(
"assistantBackButton"
)
.classList
.remove(
"hidden"
);

document
.getElementById(
"assistantOTPInput"
)
.value="";

clearMessage();

}



/* =====================================================
   GO HOME
===================================================== */

function goHome(){

window.location.href="index.html";

}



/* =====================================================
   START QR SCANNER
===================================================== */

async function startScanner(){

if(
scannerRunning||
processingScan
){

return;

}

const startButton=
document.getElementById(
"startScannerButton"
);

const resultBox=
document.getElementById(
"scanResult"
);


/* Hide previous result */

resultBox.style.display="none";

resultBox.innerHTML="";

resultBox.className="scan-result";

startButton.disabled=true;


try{

/* Explicitly request camera permission */

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Camera access is not supported by this browser."
);

}

const permissionStream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});

permissionStream
.getTracks()
.forEach(function(track){
track.stop();
});


/* Start QR scanner */

scanner=
new Html5Qrcode(
"qr-reader"
);

await scanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:{
width:250,
height:250
}
},

async function(decodedText){

/* Prevent multiple scans */

if(processingScan){

return;

}

processingScan=true;

const registrationID=
String(
decodedText||""
).trim();

if(!registrationID){

processingScan=false;

return;

}

console.log(
"QR detected:",
registrationID
);


/* SHOW PROCESSING STATE IMMEDIATELY */

resultBox.className=
"scan-result scan-processing";

resultBox.style.display="block";

resultBox.innerHTML=
"<h2>Verifying QR...</h2>"+
"<p>Please wait while the attendance record is being checked.</p>";


/* STOP CAMERA IMMEDIATELY */

try{

if(scanner){

await scanner.stop();

}

}

catch(error){

console.error(
"Scanner stop error:",
error
);

}


try{

if(scanner){

await scanner.clear();

}

}

catch(error){

console.error(
"Scanner clear error:",
error
);

}

scanner=null;

scannerRunning=false;

startButton.disabled=false;

processScan(
registrationID
);

},

function(errorMessage){

/* Ignore normal QR scanning errors */

}

);

scannerRunning=true;

}

catch(error){

console.error(
"Camera start error:",
error
);

scanner=null;

scannerRunning=false;

processingScan=false;

startButton.disabled=false;

const cameraError=
error&&error.message
?error.message
:String(error);

document
.getElementById(
"scanResult"
)
.innerHTML=
"<div class='scan-invalid'>"+
"<h2>✕ Camera Error</h2>"+
"<p>"+
escapeHtml(cameraError)+
"</p>"+
"<p>Please allow camera access and try again.</p>"+
"</div>";

document
.getElementById(
"scanResult"
)
.style
.display="block";

}

}



/* =====================================================
   PROCESS SCAN
===================================================== */

function processScan(
registrationID
){

sendScanToAppsScript(
registrationID
);

}



/* =====================================================
   SEND SCAN TO APPS SCRIPT
===================================================== */

function sendScanToAppsScript(
registrationID
){

const assistantName=
currentAssistantName||
"Assistant";

const assistantEmail=
currentAssistantEmail||
"";


/* Create JSONP callback */

const callbackName=
"icemdScanCallback_"+
Date.now();

let script=
document.createElement(
"script"
);


/* Callback */

window[callbackName]=
function(data){

console.log(
"Apps Script response:",
data
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

showScanResult(
data
);

processingScan=false;

};


/* Parameters */

const params=
new URLSearchParams();

params.append(
"action",
"scanAttendance"
);

params.append(
"registrationId",
registrationID
);

params.append(
"scannedBy",
assistantName
);

params.append(
"callback",
callbackName
);


/* Build URL */

script.src=
APPS_SCRIPT_URL+
"?"+
params.toString();


/* Connection error */

script.onerror=
function(){

console.error(
"Apps Script connection failed."
);

try{

delete window[
callbackName
];

}

catch(error){}

if(
script&&
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

showScanResult({

success:false,

result:"INVALID",

message:
"Unable to connect to attendance server."

});

processingScan=false;

};

document.body.appendChild(
script
);

}



/* =====================================================
   SHOW SCAN RESULT
===================================================== */

function showScanResult(
result
){

const box=
document.getElementById(
"scanResult"
);

box.style.display="block";

box.className="scan-result";


if(!result){

box.classList.add(
"scan-invalid"
);

box.innerHTML=
"<h2>✕ Scan Error</h2>"+
"<p>Unable to process this QR code.</p>";

return;

}


/* SUCCESS */

if(
result.result===
"SUCCESS"
){

box.classList.add(
"scan-accepted"
);

box.innerHTML=

"<h2>✓ Attendance Accepted</h2>"+

"<p><b>Name:</b> "+
escapeHtml(result.name||"")+
"</p>"+

"<p><b>Email:</b> "+
escapeHtml(result.email||"")+
"</p>"+

"<p><b>Institute:</b> "+
escapeHtml(result.institute||"")+
"</p>"+

"<p><b>Registration ID:</b> "+
escapeHtml(
result.registrationId||
result.registrationID||
""
)+
"</p>"+

"<p><b>Date:</b> "+
escapeHtml(result.date||"")+
"</p>"+

"<p><b>Time:</b> "+
escapeHtml(result.time||"")+
"</p>"+

"<p><b>Scanned By:</b> "+
escapeHtml(
result.scannedBy||
currentAssistantName
)+
"</p>";

return;

}


/* FAILED */

if(
result.result===
"FAILED"
){

box.classList.add(
"scan-duplicate"
);

box.innerHTML=

"<h2>✕ Attendance Not Accepted</h2>"+

"<p><b>Registration ID:</b> "+
escapeHtml(
result.registrationId||
result.registrationID||
""
)+
"</p>"+

"<p><b>Name:</b> "+
escapeHtml(result.name||"")+
"</p>"+

"<p><b>Reason:</b> "+
escapeHtml(
result.message||
"Attendance could not be recorded."
)+
"</p>"+

"<p><b>Scanned By:</b> "+
escapeHtml(
result.scannedBy||
currentAssistantName
)+
"</p>";

return;

}


box.classList.add(
"scan-invalid"
);

box.innerHTML=

"<h2>✕ Scan Error</h2>"+

"<p>"+

escapeHtml(
result.message||
"Unexpected server response."
)+

"</p>";

}



/* =====================================================
   MANUAL REGISTRATION ID TEST
===================================================== */

function manualScan(){

if(
processingScan
){

return;

}

const input=
document.getElementById(
"manualRegistrationID"
);

const registrationID=
input.value.trim();

if(!registrationID){

alert(
"Please enter a Registration ID."
);

return;

}


/* Hide old result */

document
.getElementById(
"scanResult"
)
.style
.display="none";

processingScan=true;

sendScanToAppsScript(
registrationID
);

}



/* =====================================================
   LOGOUT
===================================================== */

async function logoutAssistant(){

/* Stop camera first */

try{

if(scanner){

try{
await scanner.stop();
}catch(error){}

try{
await scanner.clear();
}catch(error){}

}

}

catch(error){}


scanner=null;

scannerRunning=false;

processingScan=false;


/* Clear assistant information */

currentAssistantName="";

currentAssistantEmail="";


/* Reset login fields */

document
.getElementById(
"assistantName"
)
.value="";

document
.getElementById(
"assistantEmail"
)
.value="";

document
.getElementById(
"assistantOTPInput"
)
.value="";


/* Show details */

document
.getElementById(
"assistantDetails"
)
.classList
.remove(
"hidden"
);


/* Hide OTP */

document
.getElementById(
"assistantOTP"
)
.classList
.add(
"hidden"
);


/* Show Back button */

document
.getElementById(
"assistantBackButton"
)
.classList
.remove(
"hidden"
);


/* Hide scanner */

document
.getElementById(
"assistantScannerPage"
)
.classList
.add(
"hidden"
);


/* Show login */

document
.getElementById(
